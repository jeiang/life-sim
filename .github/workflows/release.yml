name: release

# Decision 10: the user cuts a `v<N>` tag; this workflow does the rest. It runs a
# seed-sharded harness matrix over every profile, runs each forced script, fails on
# engine faults, never-matched forced entries and never-fired content, then merges
# the shards into one report (job summary, workflow artifact, release asset).
# It also rewrites ids.lock.json (docs/spec/ci.md#release-workflow).
#
# `workflow_dispatch` is the dry run: smaller sizes, never pushes anything and never
# touches a release. `inject_fault` adds a fixture that must fail the workflow.
on:
  push:
    tags: ["v[0-9]+"]
    branches: [build/release-wf]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to derive the seed from (dry run only)
        default: v0-test
      lives:
        description: Total lives across the shards
        default: "2000"
      shards:
        description: Shard count
        default: "2"
      inject_fault:
        description: Add a forced-script fixture that never matches (the run must fail)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Tag runs: 8 shards x 12,500 lives. Forced scripts: 1,000 lives each.
  TAG_LIVES: "100000"
  TAG_SHARDS: "8"
  SCRIPT_LIVES: "1000"
  SEED_BASE: "20260101"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      seed: ${{ steps.plan.outputs.seed }}
      lives: ${{ steps.plan.outputs.lives }}
      script_lives: ${{ steps.plan.outputs.script_lives }}
      shards: ${{ steps.plan.outputs.shards }}
      scripts: ${{ steps.plan.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_LIVES: ${{ inputs.lives }}
          INPUT_SHARDS: ${{ inputs.shards }}
          INJECT: ${{ inputs.inject_fault }}
        run: |
          if [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then INPUT_TAG=v0-test; INPUT_LIVES=400; INPUT_SHARDS=2; INJECT=false; fi
          if [ "$EVENT" = workflow_dispatch ] || [ "$GITHUB_REF_TYPE" = branch ]; then
            tag="$INPUT_TAG"; lives="$INPUT_LIVES"; shards="$INPUT_SHARDS"
            script_lives=$(( lives < SCRIPT_LIVES ? lives : SCRIPT_LIVES ))
          else
            tag="$GITHUB_REF_NAME"; lives="$TAG_LIVES"; shards="$TAG_SHARDS"
            script_lives="$SCRIPT_LIVES"
          fi
          [[ "$tag" =~ ^v([0-9]+) ]] || { echo "::error::tag '$tag' is not v<N>"; exit 1; }
          # Fixed per tag, so a re-run reproduces the report.
          seed=$(( SEED_BASE + 10#${BASH_REMATCH[1]} ))
          (( lives % shards == 0 )) || { echo "::error::lives $lives is not a multiple of shards $shards"; exit 1; }
          scripts=$(node --experimental-strip-types packages/harness/src/cli.ts --list-scripts | cut -f1)
          if [ "$INJECT" = true ]; then scripts="$scripts"$'\n'".github/release-fixtures/never-matched.yaml"; fi
          {
            echo "tag=$tag"
            echo "seed=$seed"
            echo "lives=$lives"
            echo "script_lives=$script_lives"
            echo "shards=$(seq 1 "$shards" | jq -cs .)"
            echo "scripts=$(printf '%s\n' "$scripts" | jq -R 'select(length > 0)' | jq -cs .)"
          } | tee -a "$GITHUB_OUTPUT"

  shards:
    name: shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the shard
        # Faults fail the shard; never-fired is only meaningful on the merged run.
        run: |
          mkdir -p out
          set +e
          node --experimental-strip-types packages/harness/src/cli.ts \
            --lives "${{ needs.prepare.outputs.lives }}" --profile all \
            --seed "${{ needs.prepare.outputs.seed }}" \
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --jobs "$(nproc)" --out out 2>&1 | tee out/console.txt
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: error

  scripts:
    name: script ${{ matrix.script }}
    needs: prepare
    if: needs.prepare.outputs.scripts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.prepare.outputs.scripts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the forced script
        # Faults and never-matched entries fail; a script reaches little content, so
        # never-fired is not checked here.
        run: |
          mkdir -p out
          set +e
          node --experimental-strip-types packages/harness/src/cli.ts \
            --script "${{ matrix.script }}" \
            --lives "${{ needs.prepare.outputs.script_lives }}" \
            --seed "${{ needs.prepare.outputs.seed }}" \
            --jobs "$(nproc)" --out out 2>&1 | tee out/console.txt
          exit "${PIPESTATUS[0]}"
      - name: Artifact name
        id: name
        if: ${{ !cancelled() }}
        run: |
          n="${{ matrix.script }}"; n="${n//[^A-Za-z0-9._-]/-}"
          echo "name=script-$n" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.name.outputs.name }}
          path: out/
          if-no-files-found: error

  merge:
    needs: [prepare, shards]
    # Merge whatever shards exist so a failing release still gets a report; the
    # gate below keeps it red.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: shards
      - name: Merge the shards
        id: merge
        run: |
          mkdir -p merged
          set +e
          node --experimental-strip-types packages/harness/src/cli.ts \
            merge shards --out merged --fail-on faults,never-fired 2>&1 | tee merged/console.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0 # fail after the report is uploaded
      - name: Summarize
        if: ${{ hashFiles('merged/report.json') != '' }}
        run: |
          {
            echo "## Release ${{ needs.prepare.outputs.tag }}"
            echo
            node .github/scripts/harness-summary.mjs merged/report.json "" "" \
              "${{ steps.merge.outputs.status }}" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > merged/summary.md
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-report
          path: merged/
          if-no-files-found: error
      - name: Fail on faults or never-fired content
        if: steps.merge.outputs.status != '0'
        run: |
          echo "::error::the merged harness run failed (status ${{ steps.merge.outputs.status }}): engine faults, never-matched forced entries or never-fired content; see the release-report artifact"
          exit 1

  locks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # so validation sees the previous tag's locks
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh ids.lock.json
        run: node --experimental-strip-types packages/pack-tools/src/cli.ts lock packs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-locks
          path: packs/*/ids.lock.json
          if-no-files-found: error

  publish:
    needs: [prepare, shards, scripts, merge, locks]
    # Tag pushes only, and only when every job above is green (a skipped `scripts`
    # job, with no scripts declared, counts as green).
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.prepare.result == 'success' && needs.shards.result == 'success' && needs.merge.result == 'success' && needs.locks.result == 'success' && (needs.scripts.result == 'success' || needs.scripts.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # release assets and the release/v<N>-locks branch
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-report
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: script-*
          path: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ids-locks
          path: locks
      - name: Commit the refreshed locks to release/${{ env.TAG }}-locks
        # The tag is not moved: it stays where the user cut it. The lock commit is a
        # child of the tagged commit, on its own branch, plus an ids-locks artifact.
        run: |
          for f in locks/*/ids.lock.json; do cp "$f" "packs/$(basename "$(dirname "$f")")/ids.lock.json"; done
          if [ -z "$(git status --porcelain packs)" ]; then echo "locks unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$TAG-locks"
          git add packs/*/ids.lock.json
          git commit -m "chore(release): ids.lock.json for $TAG"
          git push --force origin "release/$TAG-locks"
          gh pr create --base main --head "release/$TAG-locks" \
            --title "chore(release): ids.lock.json for $TAG" \
            --body "Refreshed by the release workflow run for $TAG." \
            || echo "::notice::could not open a PR (Actions may not create PRs here); the branch release/$TAG-locks has the commit"
      - name: Publish the report and scripts as release assets
        run: |
          for d in scripts/*/; do
            n=$(basename "$d")
            cp "$d/report.md" "assets/$n.md"
            cp "$d/report.json" "assets/$n.json"
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Harness report and forced-script reports for $TAG."
          gh release upload "$TAG" --clobber assets/report.md assets/report.json assets/summary.md assets/console.txt assets/script-*
