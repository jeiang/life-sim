- id: sibling-only
  trigger: action
  menu: relationships
  scope: person
  when: is_kin(person, sibling) and person.alive
  outcomes:
    - effects:
        - quality.kin_hits += 1

- id: parents-around
  trigger: action
  menu: activities
  when: count_kin(parent, 20, 120) >= 2
  outcomes:
    - effects:
        - quality.kin_hits += 10

- id: adopt-parent
  trigger: action
  menu: activities
  outcomes:
    - effects:
        - spawn_person(core-loop/parent, core-loop/parent-gen) as p
        - "quality.kin_hits += is_kin(p, parent) ? 5 : 0"

- id: half-only
  trigger: action
  menu: relationships
  scope: person
  target: [half-sibling, cousin]
  text: "{person.first_name} is your {person.kin}."
  choices:
    - label: Wave
      outcomes:
        - effects:
            - quality.kin_hits += 1

- id: partner-child
  trigger: action
  menu: activities
  outcomes:
    - effects:
        - spawn_person(core-loop/partner, core-loop/coworker-gen) as mate
        - "spawn_person(core-loop/child, core-loop/sibling-gen, parent: mate) as kid"

- id: adopt-child
  trigger: action
  menu: activities
  outcomes:
    - effects:
        - spawn_person(core-loop/partner, core-loop/coworker-gen) as mate
        - "spawn_person(core-loop/child, core-loop/sibling-gen, parent: mate, link: adopted) as kid"

- id: adopt-alone
  trigger: action
  menu: activities
  outcomes:
    - effects:
        - "spawn_person(core-loop/child, core-loop/sibling-gen, link: step) as kid"

- id: grandchild-born
  trigger: action
  menu: activities
  outcomes:
    - effects:
        - spawn_person(core-loop/child, core-loop/sibling-gen) as son
        - "spawn_person(kx/grandchild, core-loop/sibling-gen, parent: son) as grandkid"
        - "quality.kin_hits += is_kin(grandkid, grandchild) ? 7 : 0"
