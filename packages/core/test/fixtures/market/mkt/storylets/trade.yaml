- id: buy-index
  trigger: action
  menu: assets/investments
  amount: { min: 100, max: money, step: 100 }
  outcomes:
    - text: Bought {amount}.
      effects:
        - trade(index, amount)
- id: sell-index
  trigger: action
  menu: assets/investments
  amount: { min: 100, max: holding_value(index), step: 100 }
  outcomes:
    - text: Sold {amount}.
      effects:
        - trade(index, -amount)
- id: dump-index
  trigger: action
  menu: assets/investments
  outcomes:
    - effects:
        - trade(index, -1000000000)
- id: gift-index
  trigger: action
  menu: assets/investments
  outcomes:
    - effects:
        - grant_asset(index)
- id: lose-index
  trigger: action
  menu: assets/investments
  outcomes:
    - effects:
        - remove_asset(index)
