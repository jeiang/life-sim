# yaml-language-server: $schema=../../../packages/pack-tools/schema/items.schema.json
# Homes appreciate slightly each year.
- id: studio-condo
  label: Studio condo
  icon: 🏢
  category: homes
  price: 12000000
  value: asset.purchase_price * (100 + 2 * asset.years) / 100
  loan: mortgage
- id: house
  label: House
  icon: 🏠
  category: homes
  price: 25000000
  value: asset.purchase_price * (100 + 2 * asset.years) / 100
  loan: mortgage
- id: big-house
  label: Big house
  icon: 🏡
  category: homes
  price: 60000000
  value: asset.purchase_price * (100 + 3 * asset.years) / 100
  loan: mortgage
