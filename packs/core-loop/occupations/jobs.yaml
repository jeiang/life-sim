# yaml-language-server: $schema=../../../packages/pack-tools/schema/occupations.schema.json
# Pay is gross cents per year at a 100% wage index plus the player's accumulated raise bonus, scaled by the current city's wage index.
- id: cashier
  label: Cashier
  icon: 🛒
  group: part-time
  ladder: teen
  requires: age >= 14
  pay: (600000 + quality.raise_bonus) * city.wage_index / 10000
  promotes_to: barista
  promotion_years: 2
- id: barista
  label: Barista
  icon: ☕
