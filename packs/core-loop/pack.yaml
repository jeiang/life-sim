# yaml-language-server: $schema=../../packages/pack-tools/schema/pack.schema.json
id: core-loop
currency:
  symbol: "$"
  digits: 2
stats:
  - { id: happiness, label: Happiness, icon: 😊, start: [50, 100] }
  - { id: health, label: Health, icon: ❤️, start: [80, 100] }
  - { id: smarts, label: Smarts, icon: 🧠, start: [0, 100] }
  - { id: looks, label: Looks, icon: ✨, start: [0, 100] }
exclusivity: [school, full-time, part-time]
repeat: { full: 3, reduced: 8, factor: 25% }
year:
  slots: [1, 3]
  cap: 6
  decisions: [90%, 50%, 30%]
  decisions_min_age: 5
  quiet:
    - A quiet year.
    - Nothing much happened this year.
    - An uneventful year goes by.
    - A calm, ordinary year.
family:
  player: sibling-gen
  parent: { role: parent, generator: parent-gen, count: 2 }
  sibling: { role: sibling, generator: sibling-gen, count: [0, 2] }
npc_careers:
  roles: [partner, spouse, child]
  start_age: 18
  retire_age: 65
  group: full-time
  retired: retired
  hire: 40%
  promotion: 30%
  job_loss: 3%
  tiers: [1500000, 3000000, 5000000, 8000000]
  education:
    - { quality: graduated_high_school, chance: 85% }
    - { quality: has_degree_business, chance: 8%, needs: graduated_high_school }
    - { quality: has_degree_engineering, chance: 6%, needs: graduated_high_school }
    - { quality: has_degree_nursing, chance: 6%, needs: graduated_high_school }
    - { quality: has_degree_arts, chance: 4%, needs: graduated_high_school }
living:
  default: average
  housing_share: 40%
  home_category: homes
  household:
    dependent_role: child
    dependent_cost: 400000
    partner_role: partner
    partner_share: 50%
    guardian_roles: [sibling]
