# yaml-language-server: $schema=../../packages/pack-tools/schema/pack.schema.json
id: core-loop
version: 8
currency:
  symbol: "$"
  digits: 2
stats:
  - { id: happiness, label: Happiness, icon: 😊, start: [50, 100] }
  - { id: health, label: Health, icon: ❤️, start: [80, 100] }
  - { id: smarts, label: Smarts, icon: 🧠, start: [0, 100] }
  - { id: looks, label: Looks, icon: ✨, start: [0, 100] }
qualities:
  - { id: years_worked, type: int, min: 0, default: 0 }
  - { id: times_promoted, type: int, min: 0, default: 0 }
  - { id: missed_payments, type: int, min: 0, default: 0 }
  - { id: has_drivers_license, type: flag, default: false }
  - { id: has_degree_business, type: flag, default: false }
  - { id: has_degree_engineering, type: flag, default: false }
  - { id: has_degree_nursing, type: flag, default: false }
  - { id: has_degree_arts, type: flag, default: false }
  - { id: graduated_high_school, type: flag, default: false }
  - { id: tuition_by_loan, type: flag, default: false }
  - { id: raise_bonus, type: int, min: 0, default: 0 }
  - { id: work_effort, type: int, min: 0, max: 5, default: 0 }
  - { id: applying_for, type: int, min: 0, default: 0 }
  - { id: interview_score, type: int, min: 0, default: 0 }
exclusivity: [school, full-time, part-time]
repeat: { full: 10, reduced: 20, factor: 25% }
year:
  slots: [1, 3]
  cap: 6
  decisions: [90%, 50%, 30%]
  decisions_min_age: 5
  quiet:
    - A quiet year.
    - Nothing much happened this year.
    - An uneventful year goes by.
    - A calm, ordinary year.
family:
  player: sibling-gen
  parent: { role: parent, generator: parent-gen, count: 2 }
  sibling: { role: sibling, generator: sibling-gen, count: [0, 2] }
living:
  default: average
  housing_share: 40%
  home_category: homes
  household:
    dependent_role: child
    dependent_cost: 400000
    partner_role: partner
    partner_share: 50%
    guardian_roles: [sibling]
migrations: {}
