# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Hidden birth rolls. A life has no events at age 0, so each roll fires once at the first age-up
# (and once for a life from an older save, the first time it ages). Outcomes have no text: nothing
# is journaled and the player never sees the values. Packs read the qualities; none rolls its own (attraction is rolled by the dating Pack).

# `quality.family_wealth`: 1 poor, 2 modest, 3 middle, 4 comfortable, 5 wealthy.
- id: roll-family-wealth
  trigger: event
  chance: 100%
  when: age >= 1
  once: true
  outcomes:
    - { weight: 15, label: "Poor", effects: ["quality.family_wealth = 1"] }
    - { weight: 25, label: "Modest", effects: ["quality.family_wealth = 2"] }
    - { weight: 30, label: "Middle", effects: ["quality.family_wealth = 3"] }
    - { weight: 20, label: "Comfortable", effects: ["quality.family_wealth = 4"] }
    - { weight: 10, label: "Wealthy", effects: ["quality.family_wealth = 5"] }
