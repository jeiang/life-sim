# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Decisions for adulthood (about 20-59): weighted choice events (issue #99), drawn into the yearly decision slots.
# `chance: 0%` entries are follow-up scenes reached only through `next:`.

- id: job-offer-elsewhere
  icon: 📨
  trigger: event
  weight: 11
  when: age >= 22 and age <= 58 and (has_occupation(core-loop/cashier) or has_occupation(core-loop/barista) or has_occupation(core-loop/server) or has_occupation(core-loop/shift-lead) or has_occupation(core-loop/restaurant-manager) or has_occupation(core-loop/apprentice) or has_occupation(core-loop/electrician) or has_occupation(core-loop/master-electrician) or has_occupation(core-loop/junior-analyst) or has_occupation(core-loop/analyst) or has_occupation(core-loop/senior-analyst) or has_occupation(core-loop/junior-engineer) or has_occupation(core-loop/engineer) or has_occupation(core-loop/senior-engineer) or has_occupation(core-loop/staff-nurse) or has_occupation(core-loop/charge-nurse) or has_occupation(core-loop/nurse-manager) or has_occupation(core-loop/studio-assistant) or has_occupation(core-loop/designer) or has_occupation(core-loop/art-director))
  cooldown: 5
  text: "A recruiter sends a message about a role at a rival firm with a similar salary."
  choices:
    - label: "Explore the offer"
      outcomes:
        - weight: 35
          text: "A better working culture, and a signing bonus."
          effects:
            - money += 150000
            - stat.happiness += 3
        - weight: 65
          text: "The role is not quite as advertised, and the old boss is cool for a while."
          effects:
            - stat.happiness -= 2
    - label: "Politely decline"
      outcomes:
        - weight: 1
          text: "Loyalty is noted, and nothing changes."
          effects:
            - stat.happiness += 1

