# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Decisions for childhood (about 5-12): weighted choice events (issue #99), drawn into the yearly decision slots.
# `chance: 0%` entries are follow-up scenes reached only through `next:`.

- id: sandcastle-contest
  icon: 🏖️
  trigger: event
  weight: 10
  when: age >= 5 and age <= 12
  cooldown: 6
  text: "The beach hosts a sandcastle contest, and a bucket and spade are free to borrow."
  choices:
    - label: "Build an ambitious tower"
      outcomes:
        - weight: 50
          text: "The tower stands tall long enough to win a ribbon."
          effects:
            - stat.happiness += 4
            - stat.smarts += 1
        - weight: 50
          text: "The tower slumps in the first wave, but the digging was grand."
          effects:
            - stat.happiness += 1
    - label: "Dig a moat and call it a day"
      outcomes:
        - weight: 1
          text: "A modest, soggy, happy afternoon."
          effects:
            - stat.happiness += 2

- id: tooth-fairy-doubt
  icon: 🦷
  trigger: event
  weight: 14
  when: age >= 5 and age <= 9
  once: true
  text: "A wobbly tooth finally comes loose, and a classmate swears the tooth fairy is made up."
  choices:
    - label: "Leave it under the pillow anyway"
      outcomes:
        - weight: 1
          text: "A shiny coin appears by morning, and the doubts get quieter."
          effects:
            - money += 500
            - stat.happiness += 2
    - label: "Stay up to catch the fairy"
      outcomes:
        - weight: 60
          text: "Sleep wins by midnight, and a coin turns up regardless."
          effects:
            - money += 500
            - stat.smarts += 1
        - weight: 40
          text: "A parent tiptoes in, and the secret is out."
          effects:
            - stat.happiness -= 1
            - stat.smarts += 2

- id: class-hamster
  icon: 🐹
  trigger: event
  weight: 10
  when: age >= 5 and age <= 10
  cooldown: 8
  text: "It is {player.first_name}'s turn to take the class hamster home for the weekend."
  choices:
    - label: "Take excellent care of it"
      outcomes:
        - weight: 75
          text: "The hamster thrives, and the teacher is delighted."
          effects:
            - stat.happiness += 3
            - stat.smarts += 1
        - weight: 25
          text: "The hamster escapes into the sofa for a whole afternoon, then returns safe."
          effects:
            - stat.happiness += 1
    - label: "Pass the turn to a friend"
      outcomes:
        - weight: 1
          text: "A friend is thrilled, and nothing goes wrong at home."
          effects:
            - stat.happiness += 1

- id: treehouse-plans
  icon: 🌳
  trigger: event
  weight: 9
  when: age >= 7 and age <= 12
  cooldown: 8
  text: "The neighbourhood kids want to build a treehouse, and it needs a plan."
  choices:
    - label: "Draw careful blueprints"
      outcomes:
        - weight: 60
          text: "The treehouse is sturdy and instantly the best club house on the street."
          effects:
            - stat.happiness += 4
            - stat.smarts += 2
          next: treehouse-aftermath
        - weight: 40
          text: "The blueprints are lovely, but a missing plank means a wobbly floor."
          effects:
            - stat.happiness += 1
            - stat.smarts += 1
    - label: "Nail things together and see what happens"
      outcomes:
        - weight: 40
          text: "Against the odds it holds, and it has charm."
          effects:
            - stat.happiness += 3
        - weight: 60
          text: "A bent nail and a thumb collide."
          effects:
            - stat.health -= 3
            - stat.happiness += 1
    - label: "Leave it to the others"
      outcomes:
        - weight: 1
          text: "The treehouse goes up without {player.first_name}, who visits on weekends."
          effects:
            - stat.happiness -= 1

- id: sleepover-invite
  icon: 🛌
  trigger: event
  weight: 12
  when: age >= 6 and age <= 13
  cooldown: 5
  text: "A classmate invites {player.first_name} to a sleepover, and the whole class is going."
  choices:
    - label: "Go and stay up late"
      outcomes:
        - weight: 60
          text: "Torches under the blankets and giggles until dawn."
          effects:
            - stat.happiness += 4
            - stat.health -= 1
        - weight: 40
          text: "Homesickness hits at midnight, and a parent comes to collect {player.first_name}."
          effects:
            - stat.happiness -= 1
    - label: "Stay home with a book"
      outcomes:
        - weight: 1
          text: "A quiet evening and an early night."
          effects:
            - stat.smarts += 1
            - stat.happiness += 1

- id: spelling-bee
  icon: 🐝
  trigger: event
  weight: 8
  when: age >= 8 and age <= 12 and stat.smarts >= 40
  cooldown: 6
  text: "The school spelling bee needs a representative for the class."
  choices:
    - label: "Volunteer"
      outcomes:
        - weight: 1
          text: "Weeks of word lists lead to a surprisingly good finish."
          effects:
            - stat.smarts += 3
            - stat.happiness += 2
    - label: "Nominate a friend"
      outcomes:
        - weight: 1
          text: "The friend is touched and does their best."
          effects:
            - stat.happiness += 1

- id: library-book-lost
  icon: 📚
  trigger: event
  weight: 10
  when: age >= 6 and age <= 13
  cooldown: 8
  text: "A library book is nowhere to be found, and it is two weeks overdue."
  choices:
    - label: "Confess to the librarian"
      outcomes:
        - weight: 70
          text: "The librarian smiles and asks only for a small fee."
          effects:
            - money -= 300
            - stat.smarts += 1
        - weight: 30
          text: "The librarian sighs, but the book turns up in the garden shed."
          effects:
            - stat.happiness += 1
    - label: "Pretend it was never borrowed"
      outcomes:
        - weight: 50
          text: "Nobody notices, but the guilt lingers."
          effects:
            - stat.happiness -= 2
        - weight: 50
          text: "A letter arrives for the parents, and there is a stern talk."
          effects:
            - stat.happiness -= 3
            - money -= 500

- id: first-bike
  icon: 🚲
  trigger: event
  weight: 9
  when: age >= 6 and age <= 11
  once: true
  text: "{player.first_name} wants to ride a bike without stabilisers."
  choices:
    - label: "Practise every day"
      outcomes:
        - weight: 70
          text: "A week of wobbles, then suddenly flying down the road."
          effects:
            - stat.happiness += 5
            - stat.health += 1
        - weight: 30
          text: "A tumble leaves a skinned elbow, but the second try is better."
          effects:
            - stat.health -= 2
            - stat.happiness += 3
    - label: "Wait until older"
      outcomes:
        - weight: 1
          text: "The stabilisers stay on for another year, with no fuss."
          effects:
            - stat.smarts += 1

- id: chore-chart
  icon: 🧹
  trigger: event
  weight: 10
  when: age >= 6 and age <= 12
  cooldown: 5
  text: "A chore chart goes up on the fridge, and pocket money depends on it."
  choices:
    - label: "Do every chore"
      outcomes:
        - weight: 1
          text: "A tidy room and a small stash of coins."
          effects:
            - money += 800
            - stat.happiness += 1
    - label: "Do the easy ones"
      outcomes:
        - weight: 50
          text: "Half the money, half the effort."
          effects:
            - money += 300
        - weight: 50
          text: "A reminder from a parent leaves no coins at all."
          effects:
            - stat.happiness -= 1
    - label: "Strike for higher pay"
      outcomes:
        - weight: 30
          text: "A parent respects the negotiating skills and meets halfway."
          effects:
            - money += 600
            - stat.smarts += 1
        - weight: 70
          text: "The chart stays as it is, and so does the mood."
          effects:
            - stat.happiness -= 2

- id: haunted-house-dare
  icon: 👻
  trigger: event
  weight: 9
  when: age >= 8 and age <= 14
  cooldown: 6
  text: "The old house at the end of the lane is said to be haunted, and the dare is to knock on its door."
  choices:
    - label: "Knock on the door"
      outcomes:
        - weight: 60
          text: "Nothing but a cat answers, and a legend is born among the kids."
          effects:
            - stat.happiness += 3
        - weight: 40
          text: "A loud noise sends everyone sprinting, and a knee suffers on the gravel."
          effects:
            - stat.health -= 2
            - stat.happiness += 1
    - label: "Wait at the gate"
      outcomes:
        - weight: 1
          text: "The brave ones return laughing, and the gate-watcher keeps the secret."
          effects:
            - stat.smarts += 1

- id: classroom-expo
  icon: 🔬
  trigger: event
  weight: 10
  when: age >= 8 and age <= 14
  cooldown: 5
  text: "The science fair is coming, and an idea is bubbling away."
  choices:
    - label: "Build a volcano"
      outcomes:
        - weight: 70
          text: "A fizzy eruption and a rosette for effort."
          effects:
            - stat.smarts += 2
            - stat.happiness += 3
        - weight: 30
          text: "The eruption floods the kitchen table, though it impresses the judges."
          effects:
            - stat.smarts += 1
            - stat.happiness += 1
    - label: "Grow beans on the windowsill"
      outcomes:
        - weight: 1
          text: "Slow, steady, and a perfect lesson in patience."
          effects:
            - stat.smarts += 3
    - label: "Skip the fair"
      outcomes:
        - weight: 1
          text: "A free evening, and the ideas stay unexplored."
          effects:
            - stat.happiness += 1

- id: grandparent-story
  icon: 👵
  trigger: event
  weight: 9
  when: age >= 5 and age <= 13
  cooldown: 6
  text: "A grandparent offers to tell stories from their own childhood."
  choices:
    - label: "Listen for hours"
      outcomes:
        - weight: 80
          text: "A tangle of old adventures, and a closer bond."
          effects:
            - stat.happiness += 4
            - stat.smarts += 1
        - weight: 20
          text: "The same tale as last year, but the biscuit tin is full."
          effects:
            - stat.happiness += 2
    - label: "Go and play instead"
      outcomes:
        - weight: 1
          text: "Playtime wins, and the stories wait for another day."
          effects:
            - stat.happiness += 2

- id: toy-swap
  icon: 🧸
  trigger: event
  weight: 8
  when: age >= 5 and age <= 11
  cooldown: 6
  text: "A friend offers to swap a favourite toy for {player.first_name}'s shiny new one."
  choices:
    - label: "Swap"
      outcomes:
        - weight: 50
          text: "The new toy turns out to be even better."
          effects:
            - stat.happiness += 3
        - weight: 50
          text: "Regret sets in by bedtime."
          effects:
            - stat.happiness -= 2
    - label: "Keep the toy"
      outcomes:
        - weight: 1
          text: "A firm no, and the friendship carries on."
          effects:
            - stat.happiness += 1

- id: school-trip-seat
  icon: 🚌
  trigger: event
  weight: 10
  when: age >= 6 and age <= 13
  cooldown: 6
  text: "The class bus is full, and there are two seats left: one beside a friend, one beside the quiet kid."
  choices:
    - label: "Sit beside the friend"
      outcomes:
        - weight: 1
          text: "Songs and snacks all the way."
          effects:
            - stat.happiness += 2
    - label: "Sit beside the quiet kid"
      outcomes:
        - weight: 60
          text: "A new friend emerges, and the trip is better than expected."
          effects:
            - stat.happiness += 3
        - weight: 40
          text: "A silent journey, but a kind gesture is remembered."
          effects:
            - stat.happiness += 1

- id: secret-diary
  icon: 📔
  trigger: event
  weight: 8
  when: age >= 7 and age <= 14
  once: true
  text: "A shop sells a diary with a tiny padlock."
  choices:
    - label: "Buy it and write every night"
      outcomes:
        - weight: 1
          text: "Pages fill with dreams, and plans, and a better sense of self."
          effects:
            - money -= 700
            - stat.smarts += 2
            - stat.happiness += 2
    - label: "Skip it"
      outcomes:
        - weight: 1
          text: "The pocket money stays in the pocket."
          effects:
            - money += 700

- id: piano-ask
  icon: 🎹
  trigger: event
  weight: 8
  when: age >= 6 and age <= 12 and money >= 0
  once: true
  text: "A family friend offers cheap music lessons, and the question is whether to commit."
  choices:
    - label: "Commit to lessons"
      outcomes:
        - weight: 60
          text: "Scales are dull, but the first tune is magic."
          effects:
            - stat.smarts += 2
            - stat.happiness += 3
            - money -= 200
        - weight: 40
          text: "The enthusiasm fades after a month, and the lessons stop."
          effects:
            - stat.happiness -= 1
            - money -= 200
    - label: "Not for me"
      outcomes:
        - weight: 1
          text: "The piano remains a piece of furniture."
          effects:
            - stat.happiness += 1

- id: playground-argument
  icon: 🛝
  trigger: event
  weight: 10
  when: age >= 5 and age <= 10
  cooldown: 5
  text: "Two friends argue loudly over who owns the swing, and both turn to {player.first_name}."
  choices:
    - label: "Suggest taking turns"
      outcomes:
        - weight: 70
          text: "Peace is restored, and the teacher notices."
          effects:
            - stat.happiness += 2
            - stat.smarts += 1
        - weight: 30
          text: "Both are grumpy, but they play together anyway."
          effects:
            - stat.happiness += 1
    - label: "Take the swing"
      outcomes:
        - weight: 1
          text: "A cheeky grin and a quick swing, and then a flurry of complaints."
          effects:
            - stat.happiness += 1

- id: candy-mixup
  icon: 🍬
  trigger: event
  weight: 8
  when: age >= 5 and age <= 10
  cooldown: 8
  text: "The cashier hands over too much change after a sweet purchase."
  choices:
    - label: "Give it back"
      outcomes:
        - weight: 1
          text: "The cashier beams, and there is a free lollipop for honesty."
          effects:
            - stat.happiness += 2
    - label: "Keep it quiet"
      outcomes:
        - weight: 1
          text: "A small extra jangle in the pocket, and a niggle in the mind."
          effects:
            - money += 200
            - stat.happiness -= 1

- id: first-phone-ask
  icon: 📱
  trigger: event
  weight: 10
  when: age >= 12 and age <= 16 and not owns(core-loop/phone)
  cooldown: 4
  text: "Everyone has a phone but {player.first_name}."
  choices:
    - label: "Ask for one"
      outcomes:
        - weight: 60
          text: "A hand-me-down model arrives, and the world opens up."
          effects:
            - grant_asset(core-loop/phone)
            - stat.happiness += 4
        - weight: 40
          text: "The answer is 'not yet'."
          effects:
            - stat.happiness -= 2
    - label: "Save for it"
      outcomes:
        - weight: 1
          text: "A careful few months of odd jobs pay off later."
          effects:
            - money += 1500
            - stat.smarts += 1
    - label: "Shrug it off"
      outcomes:
        - weight: 1
          text: "There are other things to do."
          effects:
            - stat.smarts += 1

- id: sports-trial
  icon: ⚽
  trigger: event
  weight: 10
  when: age >= 11 and age <= 19
  cooldown: 5
  text: "Trials for the school team open this week."
  choices:
    - label: "Try out"
      outcomes:
        - weight: 40
          text: "A place on the team, with early mornings and a lot of fun."
          effects:
            - stat.health += 3
            - stat.happiness += 4
        - weight: 60
          text: "The coach says 'maybe next year', and fitness gets a lift anyway."
          effects:
            - stat.health += 2
    - label: "Cheer from the stands"
      outcomes:
        - weight: 1
          text: "A fine view and a loud voice."
          effects:
            - stat.happiness += 1

- id: teen-gaming-binge
  icon: 🎮
  trigger: event
  weight: 10
  when: age >= 12 and age <= 19
  cooldown: 5
  text: "A new game drops, and the whole weekend could vanish."
  choices:
    - label: "Play all weekend"
      outcomes:
        - weight: 60
          text: "A glorious blur of pizza and boss battles."
          effects:
            - stat.happiness += 4
            - stat.health -= 2
        - weight: 40
          text: "A big assignment is missed on Monday."
          effects:
            - stat.happiness += 1
            - stat.smarts -= 1
    - label: "Play for an hour a day"
      outcomes:
        - weight: 1
          text: "A balanced approach, and the homework is done."
          effects:
            - stat.happiness += 2
            - stat.smarts += 1
    - label: "Skip it"
      outcomes:
        - weight: 1
          text: "The sun is out, and so is {player.first_name}."
          effects:
            - stat.health += 1

- id: treehouse-aftermath
  icon: 🏠
  trigger: event
  chance: 0%
  text: "The treehouse is finished, and the club needs a rule."
  choices:
    - label: "Everyone is welcome"
      outcomes:
        - weight: 1
          text: "The treehouse fills with chatter, snacks and a growing list of friends."
          effects:
            - stat.happiness += 3
    - label: "Members only"
      outcomes:
        - weight: 1
          text: "A password is invented, and a secret club is born."
          effects:
            - stat.smarts += 1
            - stat.happiness += 2
