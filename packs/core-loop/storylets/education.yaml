- id: graduate-high-school
  icon: 🎓
  trigger: event
  tags: [education, school, custody-ok]
  chance: 100%
  when: years_in(core-loop/high-school) >= 6 and not quality.graduated_high_school
  text: "{player.first_name} walks across the stage and collects a diploma."
  outcomes:
    - weight: 1
      text: "You graduate from high school."
      effects:
        - quality.graduated_high_school = true
        - stat.happiness += 5
        - journal("Graduated from high school at age {age}.")

- id: graduate-university
  icon: 🎓
  trigger: event
  tags: [education, school, custody-ok]
  chance: 100%
  when: (years_in(core-loop/university-business) >= 4 and not quality.has_degree_business) or (years_in(core-loop/university-engineering) >= 4 and not quality.has_degree_engineering) or (years_in(core-loop/university-nursing) >= 4 and not quality.has_degree_nursing) or (years_in(core-loop/university-arts) >= 4 and not quality.has_degree_arts)
  text: "{player.first_name} graduates from university."
  outcomes:
    - weight: 1
      when: years_in(core-loop/university-business) >= 4 and not quality.has_degree_business
      text: "You earn a degree in business."
      effects:
        - quality.has_degree_business = true
        - quality.tuition_by_loan = false
        - stat.happiness += 8
        - journal("Graduated with a business degree at age {age}.")
    - weight: 1
      when: years_in(core-loop/university-engineering) >= 4 and not quality.has_degree_engineering
      text: "You earn a degree in engineering."
      effects:
        - quality.has_degree_engineering = true
        - quality.tuition_by_loan = false
        - stat.happiness += 8
        - journal("Graduated with a engineering degree at age {age}.")
    - weight: 1
      when: years_in(core-loop/university-nursing) >= 4 and not quality.has_degree_nursing
      text: "You earn a degree in nursing."
      effects:
        - quality.has_degree_nursing = true
        - quality.tuition_by_loan = false
        - stat.happiness += 8
        - journal("Graduated with a nursing degree at age {age}.")
    - weight: 1
      when: years_in(core-loop/university-arts) >= 4 and not quality.has_degree_arts
      text: "You earn a degree in arts."
      effects:
        - quality.has_degree_arts = true
        - quality.tuition_by_loan = false
        - stat.happiness += 8
        - journal("Graduated with a arts degree at age {age}.")

- id: enrol-business
  label: Study business
  icon: 🎓
  trigger: action
  menu: occupation/education
  tags: [education, university]
  when: age >= 18 and age <= 24 and quality.graduated_high_school and not (has_occupation(core-loop/elementary-school) or has_occupation(core-loop/high-school) or has_occupation(core-loop/university-business) or has_occupation(core-loop/university-engineering) or has_occupation(core-loop/university-nursing) or has_occupation(core-loop/university-arts)) and not quality.has_degree_business
  cooldown: 1
  text: "Enrol in a four-year business degree? Tuition is $9,000 a year."
  choices:
    - label: Pay tuition in cash each year
      when: money >= 900000
      outcomes:
        - weight: 1
          text: "You enrol and plan to pay tuition from your own pocket."
          effects:
            - quality.tuition_by_loan = false
            - start_occupation(core-loop/university-business)
            - journal("Enrolled in business at university at age {age}.")
    - label: Take out a student loan for all four years
      outcomes:
        - weight: 1
          text: "You enrol and sign for a student loan."
          effects:
            - take_loan(core-loop/student-loan, 3600000)
            - quality.tuition_by_loan = true
            - start_occupation(core-loop/university-business)
            - journal("Enrolled in business at university with a student loan at age {age}.")

