# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
- id: start-elementary-school
  icon: 🏫
  trigger: event
  tags: [education, school]
  chance: 100%
  when: age >= 6 and age < 12 and years_in(core-loop/elementary-school) == 0 and not has_occupation(core-loop/elementary-school)
  text: "It is time for {player.first_name} to start elementary school."
  outcomes:
    - weight: 1
      text: "You meet {m1.first_name} {m1.last_name} and {m2.first_name} {m2.last_name}."
      effects:
        - start_occupation(core-loop/elementary-school)
        - spawn_person(core-loop/classmate, core-loop/classmate-gen) as m1
        - relationship(m1).closeness += 12
        - spawn_person(core-loop/classmate, core-loop/classmate-gen) as m2
        - relationship(m2).closeness += 12
        - journal("Started elementary school at age {age}.")
    - weight: 1
      text: "You meet {m1.first_name} {m1.last_name}, {m2.first_name} {m2.last_name} and {m3.first_name} {m3.last_name}."
      effects:
        - start_occupation(core-loop/elementary-school)
        - spawn_person(core-loop/classmate, core-loop/classmate-gen) as m1
        - relationship(m1).closeness += 12
        - spawn_person(core-loop/classmate, core-loop/classmate-gen) as m2
        - relationship(m2).closeness += 12
        - spawn_person(core-loop/classmate, core-loop/classmate-gen) as m3
        - relationship(m3).closeness += 12
        - journal("Started elementary school at age {age}.")

