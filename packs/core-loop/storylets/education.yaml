- id: study-harder
  label: Study harder
  icon: 📚
  trigger: action
  menu: occupation
  tags: [education]
  when: has_occupation(core-loop/elementary-school) or has_occupation(core-loop/high-school) or has_occupation(core-loop/university-business) or has_occupation(core-loop/university-engineering) or has_occupation(core-loop/university-nursing) or has_occupation(core-loop/university-arts)
  repeatable: true
  text: "You hit the books."
  outcomes:
    - weight: 70
      text: "The extra study pays off."
      effects:
        - stat.smarts += 3
        - stat.happiness -= 1
    - weight: 30
      text: "You study hard, but little of it sticks."
      effects:
        - stat.smarts += 1
        - stat.happiness -= 2

- id: drop-out-of-university
  label: Drop out of university
  icon: 🚪
  trigger: action
  menu: occupation
  tags: [education, university]
  when: has_occupation(core-loop/university-business) or has_occupation(core-loop/university-engineering) or has_occupation(core-loop/university-nursing) or has_occupation(core-loop/university-arts)
  text: "You think about leaving university."
  choices:
    - label: Drop out
      outcomes:
        - weight: 1
          text: "You pack your dorm room and leave without a degree."
          effects:
            - end_occupation(core-loop/university-business)
            - end_occupation(core-loop/university-engineering)
            - end_occupation(core-loop/university-nursing)
            - end_occupation(core-loop/university-arts)
            - stat.happiness -= 4
            - journal("Dropped out of university at age {age}.")
    - label: Stay enrolled
