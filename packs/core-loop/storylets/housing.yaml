# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Where the player lives. Every number that shapes being kicked out lives in `parents-ask-you-to-leave`:
# the base chance, the weight of a cooler parent relationship, the stacking impatience after 30
# (capped at 10 steps) and the weight per sibling. A cultural pack can add storylets with other numbers.
- id: move-out
  label: Move out
  icon: 📦
  trigger: action
  menu: assets/housing
  tags: [housing]
  when: age >= 18 and living.with_parents
  text: "You pack your things and leave your parents' home in {city.label}."
  outcomes:
    - weight: 1
      text: "You have a place of your own now."
      effects:
        - move_out()
        - journal("Moved out of your parents' home in {city.label} at age {age}.")

- id: move-city
  label: Move to another city
  icon: 🚚
  trigger: action
  menu: assets/housing
  tags: [housing]
  when: (age >= 18 or living.no_guardian) and not living.with_parents and money >= 250000
  text: "Moving costs $2,500."
  choices:
    - { label: Dustwater, when: city.id != core-loop/dustwater and money >= 250000, outcomes: [{ weight: 1, text: "You settle into Dustwater.", effects: [money -= 250000, move_to(core-loop/dustwater), "journal(\"Moved to Dustwater at age {age}.\")"] }] }
    - { label: Harborview, when: city.id != core-loop/harborview and money >= 250000, outcomes: [{ weight: 1, text: "You settle into Harborview.", effects: [money -= 250000, move_to(core-loop/harborview), "journal(\"Moved to Harborview at age {age}.\")"] }] }
    - { label: Maple Falls, when: city.id != core-loop/maple-falls and money >= 250000, outcomes: [{ weight: 1, text: "You settle into Maple Falls.", effects: [money -= 250000, move_to(core-loop/maple-falls), "journal(\"Moved to Maple Falls at age {age}.\")"] }] }
    - { label: Riverton, when: city.id != core-loop/riverton and money >= 250000, outcomes: [{ weight: 1, text: "You settle into Riverton.", effects: [money -= 250000, move_to(core-loop/riverton), "journal(\"Moved to Riverton at age {age}.\")"] }] }
    - { label: Lakeshore, when: city.id != core-loop/lakeshore and money >= 250000, outcomes: [{ weight: 1, text: "You settle into Lakeshore.", effects: [money -= 250000, move_to(core-loop/lakeshore), "journal(\"Moved to Lakeshore at age {age}.\")"] }] }
    - { label: Goldcrest, when: city.id != core-loop/goldcrest and money >= 250000, outcomes: [{ weight: 1, text: "You settle into Goldcrest.", effects: [money -= 250000, move_to(core-loop/goldcrest), "journal(\"Moved to Goldcrest at age {age}.\")"] }] }
    - label: Stay where you are

- id: parents-ask-you-to-leave
  icon: 🚪
  trigger: event
  tags: [housing]
  when: age >= 18 and living.with_parents
  chance: (100 + (100 - role_closeness(core-loop/parent)) * 4 + min(10, max(0, age - 30)) * 150 + count_role(core-loop/sibling, 0, 100) * 75) * quality.kickout_pct / 100
  text: "Your parents sit you down: it is time you had a place of your own."
  outcomes:
    - weight: 1
      effects:
        - move_out()
        - stat.happiness -= 5
        - journal("Your parents asked you to move out at age {age}.")

- id: parents-put-you-out
  icon: 🚪
  trigger: event
  tags: [housing]
  when: age >= 16 and age < 18 and living.with_parents
  chance: 50 + (100 - role_closeness(core-loop/parent)) * 2
  text: "Things have broken down at home: your parents tell you to get out."
  outcomes:
    - weight: 1
      effects:
        - move_out()
        - stat.happiness -= 8
        - journal("Your parents put you out at age {age}.")

- id: choose-standard
  label: Standard of living
  icon: 🏷️
  trigger: action
  menu: assets/housing
  tags: [housing]
  when: (age >= 18 or living.no_guardian) and not living.with_parents
  text: "How do you want to live? You pay for it every year."
  choices:
    - { label: Homeless, when: "living.standard != core-loop/homeless and standard_cost(core-loop/homeless) <= money", outcomes: [{ weight: 1, text: "You live a homeless life from now on.", effects: ["set_standard(core-loop/homeless)", "journal(\"Changed your standard of living to homeless at age {age}.\")"] }] }
    - { label: Thrifty, when: "living.standard != core-loop/thrifty and standard_cost(core-loop/thrifty) <= money", outcomes: [{ weight: 1, text: "You live a thrifty life from now on.", effects: ["set_standard(core-loop/thrifty)", "journal(\"Changed your standard of living to thrifty at age {age}.\")"] }] }
    - { label: Average, when: "living.standard != core-loop/average and standard_cost(core-loop/average) <= money", outcomes: [{ weight: 1, text: "You live a average life from now on.", effects: ["set_standard(core-loop/average)", "journal(\"Changed your standard of living to average at age {age}.\")"] }] }
    - { label: Above average, when: "living.standard != core-loop/above-average and standard_cost(core-loop/above-average) <= money", outcomes: [{ weight: 1, text: "You live a above average life from now on.", effects: ["set_standard(core-loop/above-average)", "journal(\"Changed your standard of living to above average at age {age}.\")"] }] }
    - { label: Wealthy, when: "living.standard != core-loop/wealthy and standard_cost(core-loop/wealthy) <= money", outcomes: [{ weight: 1, text: "You live a wealthy life from now on.", effects: ["set_standard(core-loop/wealthy)", "journal(\"Changed your standard of living to wealthy at age {age}.\")"] }] }
    - { label: Rich, when: "living.standard != core-loop/rich and standard_cost(core-loop/rich) <= money", outcomes: [{ weight: 1, text: "You live a rich life from now on.", effects: ["set_standard(core-loop/rich)", "journal(\"Changed your standard of living to rich at age {age}.\")"] }] }
    - { label: Ultra-rich, when: "living.standard != core-loop/ultra-rich and standard_cost(core-loop/ultra-rich) <= money", outcomes: [{ weight: 1, text: "You live a ultra-rich life from now on.", effects: ["set_standard(core-loop/ultra-rich)", "journal(\"Changed your standard of living to ultra-rich at age {age}.\")"] }] }
    - label: Keep things as they are
