# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Job board -> two-question interview chain (`next:`) -> hire. Which job is being applied for is carried
# in `quality.applying_for` (the index in the list below); `quality.interview_score` accumulates answers.
# Promotion is data (`promotes_to`) plus the promote-* events below; raises are `quality.raise_bonus`.

- id: apply-cashier
  label: Apply as a cashier
  icon: 🛒
  trigger: action
  menu: activities/job-board
  tags: [job, apply]
  when: age >= 14 and not (has_occupation(core-loop/cashier) or has_occupation(core-loop/barista)) and not has_occupation(core-loop/retired)
  cooldown: 1
  text: "The job board has an opening for a cashier."
  outcomes:
    - weight: 1
      text: "You send in an application and get called in for an interview."
      effects:
        - quality.applying_for = 1
        - quality.interview_score = 0
      next: interview-question-1

