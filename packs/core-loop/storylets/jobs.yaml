- id: promote-cashier
  icon: 📈
  trigger: event
  tags: [job, promotion]
  chance: 1000 + quality.work_effort * 600 + stat.smarts * 8
  when: has_occupation(core-loop/cashier) and years_in(core-loop/cashier) >= 2 and (age >= 14)
  text: "{player.first_name}'s manager calls a meeting."
  outcomes:
    - weight: 1
      text: "You are promoted from cashier to barista."
      effects:
        - start_occupation(core-loop/barista)
        - quality.times_promoted += 1
        - quality.raise_bonus = 0
        - quality.work_effort = 0
        - stat.happiness += 6
        - journal("Promoted to barista at age {age}.")

