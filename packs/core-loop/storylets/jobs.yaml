- id: interview-question-1
  icon: 🗣️
  trigger: event
  chance: 0%
  text: "The interviewer leans forward: \"Why do you want to work here?\""
  choices:
    - label: Talk about your skills
      outcomes:
        - weight: 30 + stat.smarts / 2
          text: "Your answer is sharp and well prepared."
          effects:
            - quality.interview_score += 2
          next: interview-question-2
        - weight: 50
          text: "Your answer is fine, if a little rehearsed."
          effects:
            - quality.interview_score += 1
          next: interview-question-2
        - weight: 20
          text: "You ramble and lose the thread."
          next: interview-question-2
    - label: Be honest about needing the money
      outcomes:
        - weight: 40
          text: "They appreciate the candour."
          effects:
            - quality.interview_score += 1
          next: interview-question-2
        - weight: 60
          text: "It lands as a little desperate."
          next: interview-question-2

- id: interview-question-2
  icon: 🗣️
  trigger: event
  chance: 0%
  text: "\"Tell me about a time you handled a difficult situation.\""
  choices:
    - label: Stay calm and logical
      outcomes:
        - weight: 20 + stat.smarts / 2
          text: "A clear, composed story."
          effects:
            - quality.interview_score += 2
          next: interview-result
        - weight: 40
          text: "Your story is okay."
          effects:
            - quality.interview_score += 1
          next: interview-result
        - weight: 20
          text: "You blank halfway through."
          next: interview-result
    - label: Lean on your charm
      outcomes:
        - weight: 15 + stat.looks / 2
          text: "You have the room smiling."
          effects:
            - quality.interview_score += 2
          next: interview-result
        - weight: 40
          text: "Pleasant, but short on substance."
          effects:
            - quality.interview_score += 1
          next: interview-result
        - weight: 25
          text: "The charm comes across as glib."
          next: interview-result

- id: interview-result
  icon: 💼
  trigger: event
  chance: 0%
  text: "The interviewer thanks you and says they will be in touch."
  outcomes:
    - weight: 20 + quality.interview_score * 15 + stat.smarts / 4
      when: quality.applying_for == 1
      text: "You got the job! You start as a cashier, and {c1.first_name} {c1.last_name} and {c2.first_name} {c2.last_name} show you around."
      effects:
        - start_occupation(core-loop/cashier)
        - quality.raise_bonus = 0
        - quality.work_effort = 0
        - spawn_person(core-loop/coworker, core-loop/coworker-gen) as c1
        - spawn_person(core-loop/coworker, core-loop/coworker-gen) as c2
        - relationship(c1).closeness += 10
        - relationship(c2).closeness += 10
        - stat.happiness += 4
        - journal("Started work as a cashier at age {age}.")
    - weight: 70 - quality.interview_score * 10
      when: quality.applying_for == 1
      text: "They went with another candidate."
      effects:
        - stat.happiness -= 2
