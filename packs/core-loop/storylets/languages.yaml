# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# One skill per language (`quality.lang_<language>`, 0-100; English starts at 100, the rest at 0),
# owned here so every Pack can read them. "Study a language" is available anywhere and repeatable.
# Qualities are never scaled by the repeat curve, so the skill gain follows the same curve by
# hand: the full gain for uses 1-10 in a year, a third from 11 to 20, none from 21 (the same
# thresholds as the Pack's `repeat`). Smarts and happiness change through the Core curve.

- id: study-a-language
  label: Study a language
  icon: 🗣️
  trigger: action
  menu: activities/languages
  tags: [education, language]
  when: age >= 6
  repeatable: true
  text: "You sit down with a language course."
  choices:
    - label: English
      when: quality.lang_english < 100
      outcomes:
        - weight: 60
          text: "A productive session, and the English starts to click."
          effects:
            - "quality.lang_english += (uses_this_year <= 10 ? 6 : (uses_this_year <= 20 ? 2 : 0))"
            - stat.smarts += 1
        - weight: 40
          text: "Slow going today, but a little of the English sticks."
          effects:
            - "quality.lang_english += (uses_this_year <= 10 ? 3 : (uses_this_year <= 20 ? 1 : 0))"
            - stat.happiness -= 1
