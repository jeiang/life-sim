# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# NPC storylets (`scope: person`) run once per non-player person in the yearly NPC pass.
#
# `target: [core-loop/parent]` restricts a storylet to the player's parents; other storylets
# use age windows. Effects on stats, money and qualities apply to the player, as the player's
# reaction. `die(...)` in `scope: person` kills the bound person, not the player.

- id: parent-illness
  icon: 🤒
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/parent]
  chance: 4%
  when: person.age >= 50 and person.stat.health < 70
  cooldown: 3
  text: "{person.first_name} {person.last_name} has been unwell for months and {player.first_name} worries."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness -= 4
        - journal("{person.first_name} {person.last_name} was ill this year.")

- id: parent-recovery
  icon: 🌤️
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/parent]
  chance: 5%
  when: person.age >= 50 and person.stat.health >= 50 and person.stat.health < 80
  text: "{person.first_name} {person.last_name} is back on their feet, much to everyone's relief."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness += 3

- id: parent-death
  icon: 🕊️
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/parent]
  chance: min(10000, (person.age * person.age * person.age * person.age / 68000) * (140 - person.stat.health) / 90)
  when: person.age >= 60
  once: true
  outcomes:
    - weight: 1
      effects:
        - stat.happiness -= 20
        - die("natural causes")

- id: parent-gift
  icon: 🎁
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/parent]
  chance: 3%
  when: person.age >= 45 and age >= 16
  text: "{person.first_name} {person.last_name} slips {player.first_name} a card with some cash inside."
  outcomes:
    - weight: 1
      effects:
        - money += 10000
        - stat.happiness += 2

- id: sibling-starts-school
  icon: 🎒
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/sibling]
  chance: 100%
  when: person.age == 6
  text: "{person.first_name} puts on a new backpack and heads to the first day of school."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness += 1

- id: sibling-learns-to-ride
  icon: 🚲
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/sibling]
  chance: 40%
  when: person.age >= 5 and person.age <= 8 and age >= 4
  once: true
  text: "{person.first_name} wobbles down the street on two wheels for the first time."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness += 2

- id: sibling-school-award
  icon: 🏅
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/sibling]
  chance: 6%
  when: person.age >= 8 and person.age <= 18 and person.stat.smarts >= 60
  cooldown: 3
  text: "{person.first_name} brings home a certificate from school."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness += 2

- id: sibling-graduates
  icon: 🎓
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/sibling]
  chance: 100%
  when: person.age == 18
  text: "{person.first_name} graduates from high school, and the family celebrates."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness += 3
        - journal("{person.first_name} graduated high school.")

- id: sibling-rivalry
  icon: ⚔️
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/sibling]
  chance: 6%
  when: person.age >= 8 and person.age <= 17 and age >= 8 and age <= 17
  cooldown: 3
  text: "{person.first_name} and {player.first_name} argue over the bathroom, the remote, and who started it."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness -= 2

- id: person-new-job
  icon: 💼
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/sibling, core-loop/friend, core-loop/coworker, core-loop/partner, core-loop/spouse, core-loop/child]
  chance: 3%
  when: person.age >= 24 and person.age <= 55
  cooldown: 4
  text: "{person.first_name} {person.last_name} lands a new job and invites {player.first_name} out to celebrate."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness += 2

- id: person-checks-in
  icon: ☎️
  trigger: event
  tags: [npc, custody-ok]
  scope: person
  target: [core-loop/parent, core-loop/sibling, core-loop/friend, core-loop/partner, core-loop/spouse, core-loop/child]
  chance: 5%
  when: person.age >= 30 and age >= 20
  cooldown: 3
  text: "{person.first_name} calls just to catch up."
  outcomes:
    - weight: 1
      effects:
        - stat.happiness += 2

# Generic mortality for human roles. Parents have their own `parent-death` (rates unchanged), so
# they are not listed; a role added later (pets, say) is not human and is not listed either.
# Same shape as the player's `natural-mortality` (age^4 / 90000, health-weighted) from age 30,
# and the player's `childhood-mortality` rate below it.
- id: person-mortality
  icon: 🕯️
  trigger: event
  tags: [npc, mortality, custody-ok]
  scope: person
  target: [core-loop/sibling, core-loop/classmate, core-loop/coworker, core-loop/friend, core-loop/partner, core-loop/spouse, core-loop/child]
  chance: "min(10000, person.age >= 30 ? (person.age * person.age * person.age * person.age / 90000) * (140 - person.stat.health) / 90 + max(0, person.age - 100) * 1000 : 3 + max(0, 12 - person.age))"
  when: person.age >= 1
  once: true
  outcomes:
    - weight: 1
      effects:
        - stat.happiness -= 3 + person.closeness / 8
        - journal("{person.first_name} {person.last_name} died at age {person.age}.")
        - die("natural causes")
