# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# The first three verbs and `befriend` are person-targeted (`scope: person`): the relationships
# UI offers them for a chosen person, with `person` bound. `target` limits them to people
# who hold one of the listed roles toward the player. The two "make a friend" verbs meet
# someone new, so they bind no person and spawn one instead.
- id: spend-time-with-loved-ones
  label: Spend time together
  icon: 🫶
  trigger: action
  menu: relationships
  scope: person
  tags: [relationship, spend-time]
  repeatable: true
  text: "You set aside an afternoon for {person.first_name}."
  outcomes:
    - weight: 70
      text: "You share a meal and plenty of laughs."
      effects:
        - stat.happiness += 4
        - relationship(person).closeness += 6
        - journal("Spent quality time with {person.first_name} at age {age}.")
    - weight: 20
      text: "The time together is pleasant if unremarkable."
      effects:
        - stat.happiness += 2
        - relationship(person).closeness += 2
    - weight: 10
      text: "You end up arguing over something small."
      effects:
        - stat.happiness -= 2
        - relationship(person).closeness += -3

- id: have-a-conversation
  label: Have a conversation
  icon: 💬
  trigger: action
  menu: relationships
  scope: person
  tags: [relationship, conversation]
  when: age >= 3 and person.age >= 3
  repeatable: true
  text: "You strike up a conversation with {person.first_name}."
  outcomes:
    - weight: 60
      text: "You have a warm, honest talk and learn something."
      effects:
        - stat.happiness += 2
        - relationship(person).closeness += 4
    - weight: 30
      text: "Small talk, but friendly."
      effects:
        - stat.happiness += 1
        - relationship(person).closeness += 1
    - weight: 10
      text: "The conversation goes sideways and leaves you drained."
      effects:
        - stat.happiness -= 2
        - relationship(person).closeness += -2

- id: ask-parents-for-money
  label: Ask for money
  icon: 💵
  trigger: action
  menu: relationships
  scope: person
  target: [core-loop/parent]
  tags: [relationship, money, family]
  when: age >= 6 and age < 30
  cooldown: 2
  text: "You ask {person.first_name} for some money."
  outcomes:
    - weight: 45
      text: "They hand over some cash with a gentle reminder to be responsible."
      effects:
        - money += 2000
        - journal("Got some money from {person.first_name} at age {age}.")
    - weight: 30
      text: "They give you a little, along with a lecture about saving."
      effects:
        - money += 500
        - stat.happiness -= 1
        - relationship(person).closeness += -1
    - weight: 25
      text: "They say no and suggest you earn it yourself."
      effects:
        - stat.happiness -= 3
        - relationship(person).closeness += -2

- id: befriend
  label: Become friends
  icon: 🤝
  trigger: action
  menu: relationships
  scope: person
  target: [core-loop/classmate, core-loop/coworker]
  tags: [relationship, befriend]
  when: age >= 6
  cooldown: 1
  text: "You make an effort to get closer to {person.first_name}."
  outcomes:
    - weight: 55 + stat.looks / 5
      text: "{person.first_name} warms to you."
      effects:
        - relationship(person).closeness += 12
        - stat.happiness += 2
    - weight: 45
      text: "The moment passes, but you part on good terms."
      effects:
        - relationship(person).closeness += 2

- id: make-a-friend-classmate
  label: Make a friend at school
  icon: 🤝
  trigger: action
  menu: relationships
  tags: [relationship, befriend]
  when: age >= 6 and age < 18
  cooldown: 1
  text: "You try to befriend someone at school."
  outcomes:
    - weight: 60 + stat.looks / 5
      text: "You and {friend.first_name} {friend.last_name} hit it off."
      effects:
        - spawn_person(core-loop/friend, core-loop/classmate-gen) as friend
        - relationship(friend).closeness += 25
        - stat.happiness += 3
        - journal("Made a new friend, {friend.first_name} {friend.last_name}, at age {age}.")
    - weight: 40
      text: "They seem busy and the moment passes."
      effects:
        - stat.happiness -= 1

- id: make-a-friend-coworker
  label: Make a friend at work
  icon: 🤝
  trigger: action
  menu: relationships
  tags: [relationship, befriend]
  when: age >= 18
  cooldown: 1
  text: "You make an effort to get to know someone you work around."
  outcomes:
    - weight: 55 + stat.looks / 5
      text: "You and {friend.first_name} {friend.last_name} swap stories over coffee."
      effects:
        - spawn_person(core-loop/friend, core-loop/coworker-gen) as friend
        - relationship(friend).closeness += 25
        - stat.happiness += 3
        - journal("Befriended {friend.first_name} {friend.last_name} at age {age}.")
    - weight: 45
      text: "Conversation stalls and you part ways politely."

- id: friend-from-nowhere
  icon: 🧑‍🤝‍🧑
  trigger: event
  tags: [relationship, befriend]
  weight: 6
  when: age >= 6 and age < 18
  cooldown: 3
  text: "A kid in your class asks if you want to sit together."
  outcomes:
    - weight: 1
      text: "You and {friend.first_name} {friend.last_name} start spending time together."
      effects:
        - spawn_person(core-loop/friend, core-loop/classmate-gen) as friend
        - relationship(friend).closeness += 20
        - stat.happiness += 3
        - journal("Made a friend, {friend.first_name} {friend.last_name}, at age {age}.")
