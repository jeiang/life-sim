# Harness metrics for the Crime Pack; the schema is docs/spec/harness.md#pack-metrics.
title: Crime
intro: Arrest, conviction and imprisonment by profile (`criminal` commits crimes on purpose; `random` has crime down-weighted), and what a conviction costs. Money is in minor units.
measures:
  arrests: { quality: crime_arrests, at: end }
  arrested: { when: "arrests > 0" }
  convictions: { quality: crime_convictions, at: end }
  convicted: { when: "convictions > 0" }
  sentences: { quality: crime_sentences, at: end }
  imprisoned: { when: "sentences > 0" }
  record_ever: { quality: crime_record, at: ever }
  record_end: { quality: crime_record, at: end }
  executed: { death: executed }
  murdered_someone: { fires: { storylet: crime/murder } }
  assaulted: { fires: { storylet: crime/assault } }
  property_crimes: { fires: { tag: property-crime } }
  property_offender: { when: "property_crimes > 0" }
  murders_unsolved: { outcome: { storylet: crime/murder, key: c0.o0 } }
  murders_caught: { outcome: { storylet: crime/murder, key: c0.o1 } }
  murderer: { when: "murders_unsolved > 0 or murders_caught > 0" }
  serial_murderer: { when: "murders_unsolved > 1 or murders_caught > 1 or (murders_unsolved > 0 and murders_caught > 0)" }
  offender: { when: "property_crimes > 0 or murderer or assaulted > 0" }
  diploma_end: { quality: graduated_high_school, at: end }
  studied_ged: { fires: { tag: ged } }
  earned_prison_ged: { outcome: { storylet: crime/prison-study-ged, key: o0 } }
  earned_juvie_ged: { outcome: { storylet: crime/juvie-study-ged, key: o0 } }
  earned_ged: { when: "earned_prison_ged > 0 or earned_juvie_ged > 0" }
  inmate_no_diploma: { when: "imprisoned and diploma_end == 0" }
  escaped: { quality: crime_escapes, at: ever }
  recaptures: { fires: { storylet: crime/crime-recaptured } }
  paroled: { outcome: { storylet: crime/parole-review, key: o1 } }
  nw65: { snapshot: net_worth, ages: [65] }
stats:
  escaped_share:
    kind: share
    when: escaped
    of: imprisoned
    label: sentenced lives that broke out
  recaptured_share:
    kind: share
    when: "recaptures > 0"
    of: escaped
    label: escapees recaptured
  paroled_share:
    kind: share
    when: "paroled > 0"
    of: imprisoned
    label: sentenced lives granted parole
  property_offenders:
    kind: share
    when: property_offender
    by: profile
    label: committed a property crime
  murderers:
    kind: share
    when: murderer
    by: profile
    label: murdered someone
  serial_murderers:
    kind: share
    when: serial_murderer
    by: profile
    label: murdered twice or more
  convicted_of_offenders:
    kind: share
    when: convicted
    of: offender
    label: offenders convicted
  imprisoned_of_convicted:
    kind: share
    when: imprisoned
    of: convicted
    label: convicted lives sentenced to custody
  reoffended:
    kind: share
    when: "arrests > 1"
    of: arrested
    label: arrested lives arrested again (recidivism)
  reconvicted:
    kind: share
    when: "convictions > 1"
    of: convicted
    label: convicted lives convicted again
  ged_studied:
    kind: share
    when: "studied_ged > 0"
    of: offender
    label: offenders who studied for a GED (juvenile detention or prison)
  ged_earned:
    kind: share
    when: earned_ged
    of: offender
    label: offenders who earned a GED
  no_diploma_inmates:
    kind: share
    when: inmate_no_diploma
    of: imprisoned
    label: sentenced lives that ended without a diploma
  offenders:
    kind: share
    when: offender
    by: profile
    label: committed a crime
  arrested_share:
    kind: share
    when: arrested
    by: profile
    label: arrested
  arrested_of_offenders:
    kind: share
    when: arrested
    of: offender
    label: offenders arrested
  convicted_share:
    kind: share
    when: convicted
    by: profile
    label: convicted
  imprisoned_share:
    kind: share
    when: imprisoned
    by: profile
    label: sentenced to custody
  record_share:
    kind: share
    when: record_ever
    by: profile
    label: had a record
  record_end_share:
    kind: share
    when: record_end
    by: profile
    label: record still on file at the end
  executed_share:
    kind: share
    when: executed
    label: executed
  arrests_per_arrested:
    kind: dist
    value: arrests
    of: arrested
    label: arrests per arrested life
  nw65_convicted:
    kind: median
    value: nw65
    of: convicted
    ages: [65]
    label: net worth at 65, convicted lives (median)
  nw65_clean:
    kind: median
    value: nw65
    of: "not convicted"
    ages: [65]
    label: net worth at 65, never convicted (median)
blocks:
  - text: An offender is a life that opened any crime action.
  - stats: [property_offenders, murderers, serial_murderers]
  - stats: [convicted_of_offenders, imprisoned_of_convicted, reoffended, reconvicted]
  - stats: [ged_studied, ged_earned, no_diploma_inmates]
  - stats: [offenders, arrested_share, convicted_share, imprisoned_share, record_share, record_end_share]
  - stats: [arrested_of_offenders, executed_share]
  - stats: [escaped_share, recaptured_share, paroled_share]
  - stats: [arrests_per_arrested]
  - text: Net worth at 65 (minor units).
  - stats: [nw65_convicted, nw65_clean]
