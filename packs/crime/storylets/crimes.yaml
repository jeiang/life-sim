# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Property crimes (actions, `activities/crime`): age gate, once a year (`cooldown: 1`), a payout or being
# caught. Caught sets the case (severity, no resisting) and opens the court chain at `crime-caught`.
# Risk rises with a record or parole and falls with smarts. Karma drops once per action (they are not repeatable).

- id: shoplift
  label: Shoplift
  icon: 🛍️
  trigger: action
  menu: activities/crime
  tags: [crime]
  when: age >= 12
  cooldown: 1
  text: "You case the place. It is illegal, and the risk is real."
  outcomes:
    - weight: 55
      text: "You slip a few things under your coat and walk out. Worth about $60."
      effects:
        - money += 6000
        - quality.karma += -3
        - stat.happiness += 1
    - weight: 45
      text: "You grab more than expected, close to $150 of goods."
      effects:
        - money += 15000
        - quality.karma += -3
        - stat.happiness += 1
    - weight: max(1, 22 + (quality.criminal_record ? 10 : 0) + (quality.crime_on_parole ? 10 : 0) - stat.smarts / 6)
      text: "A security guard grabs your arm at the door and calls the police."
      effects:
        - quality.crime_severity = 1
        - quality.crime_resisting = false
        - quality.crime_arrests += 1
        - quality.karma += -3
      next: crime-caught

