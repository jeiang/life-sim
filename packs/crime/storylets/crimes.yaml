# Violence is person-scoped and sits behind a confirm step.
- id: assault
  label: Assault
  icon: 👊
  trigger: action
  menu: relationships
  scope: person
  tags: [crime]
  when: age >= 12 and person.alive
  cooldown: 1
  text: "You are furious with {person.first_name}. Hitting {person.object} would be a crime."
  choices:
    - label: Attack
      outcomes:
        - weight: 65
          text: "You hurt {person.first_name} badly and walk away. Nobody calls the police."
          effects:
            - relationship(person).closeness += -35
            - quality.karma += -6
            - stat.happiness += -2
        - weight: max(1, 25 + (quality.criminal_record ? 10 : 0) + (quality.crime_on_parole ? 10 : 0))
          text: "A neighbour calls the police. You are arrested for assault."
          effects:
            - relationship(person).closeness += -35
            - quality.karma += -6
            - quality.crime_severity = 2
            - quality.crime_resisting = false
            - quality.crime_arrests += 1
          next: crime-caught
        - weight: 10
          text: "{person.first_name} lands in hospital with serious injuries. The charge is aggravated assault."
          effects:
            - relationship(person).closeness += -50
            - quality.karma += -8
            - quality.crime_severity = 3
            - quality.crime_resisting = false
            - quality.crime_arrests += 1
          next: crime-caught
    - label: Walk away
      outcomes:
        - weight: 1
          text: "You take a breath and leave. The moment passes."

- id: murder
  label: Murder
  icon: 🔪
  trigger: action
  menu: relationships
  scope: person
  tags: [crime]
  when: age >= 14 and person.alive
  cooldown: 1
  text: "Killing {person.first_name} cannot be undone. Are you sure?"
  choices:
    - label: Go through with it
      outcomes:
        - weight: max(1, 55 - stat.smarts / 4)
          text: "{person.first_name} is dead, and the scene shows no sign of you. For now."
          effects:
            - die("murdered")
            - quality.crime_murders += 1
            - quality.karma += -20
            - stat.happiness += -12
            - journal("Killed {person.first_name} at age {age}.")
        - weight: max(1, 45 + stat.smarts / 4 + (quality.criminal_record ? 10 : 0))
          text: "{person.first_name} is dead, and the police are at your door within hours."
          effects:
            - die("murdered")
            - quality.karma += -20
            - stat.happiness += -12
            - quality.crime_severity = 4
            - quality.crime_resisting = false
            - quality.crime_arrests += 1
            - journal("Killed {person.first_name} at age {age}.")
          next: crime-caught
    - label: Back out
      outcomes:
        - weight: 1
          text: "You put it down. It was never going to happen."

# An unsolved murder can still come back.
- id: old-murder-surfaces
  icon: 🕵️
  trigger: event
  chance: 4%
  when: quality.crime_murders > 0
  text: "A cold-case detective reopens an old murder file. Your name is in it."
  outcomes:
    - weight: 1
      effects:
        - quality.crime_murders = 0
        - quality.crime_severity = 4
        - quality.crime_resisting = false
        - quality.crime_arrests += 1
      next: crime-caught
