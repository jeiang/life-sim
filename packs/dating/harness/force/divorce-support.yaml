# Forced script: a couple that has a child splits up and the ex keeps the kids, so the player pays yearly child support until the child turns 18.
description: Marriage, a baby, then a divorce where the ex keeps the kids and the player pays child support
profile: unfaithful
steps:
  - roll: outcome/dating/ask-out
    value: 0
  - roll: outcome/dating/propose
    value: 0
  - roll: outcome/dating/try-for-a-baby
    value: 1
  - roll: outcome/dating/pregnancy-end
    value: 1
  - roll: outcome/dating/partner-pregnancy-end
    value: 1
  - choose: "Keep the baby"
