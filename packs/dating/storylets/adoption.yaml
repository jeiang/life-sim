# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Scaffolded by `pnpm tool scaffold` from the content sheet "Adoption".

- id: adopt-a-child
  icon: 👶
  trigger: action
  menu: relationships
  label: Adopt a child
  when: "age >= 21 and not living.with_parents and living.standard != core-loop/homeless and money >= 500000"
  max_per_life: 1
  text: You fill out a stack of forms, pass the home visit, and bring home a child who has waited a long time for a family.
  outcomes:
    - weight: 1
      text: The agency hands over the papers. A new child is sitting on your sofa with a small bag and a lot of questions.
      effects:
        - money -= 500000
        - "spawn_person(core-loop/child, dating/adoptee-gen, link: adopted) as kid"
        - "reach_milestone(adopted)"
        - "quality.dating_children += 1"
