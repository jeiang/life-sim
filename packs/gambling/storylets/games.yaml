# Casino games, the lottery and their follow-up hands. Generated structure; edit the numbers with care: every table's theoretical return is in BALANCE.md.

- id: play-roulette
  label: "Play roulette"
  icon: 🎡
  trigger: action
  menu: activities/casino
  tags: [casino, gambling]
  when: age >= 18 and age >= quality.gambling_banned_until
  repeatable: true
  amount:
    min: 500
    max: "min(money, quality.gambling_vip ? 500000 : 50000)"
    step: 100
  text: "The wheel is spinning. Roulette: minimum $5, table limit $500 ($5,000 in the VIP room). What do you back?"
  choices:
    - label: "Red or black (pays 1 to 1)"
      outcomes:
        - weight: 4750
          text: "The ball settles on your colour."
          effects:
            - money += amount
            - quality.gambling_bets_year += 1
            - quality.gambling_wagered += amount
            - quality.gambling_streak += 1
            - stat.happiness += 2
        - weight: 5250
          text: "The ball lands on the other colour."
          effects:
            - money -= amount
            - quality.gambling_bets_year += 1
            - quality.gambling_wagered += amount
            - quality.gambling_streak = 0
            - quality.gambling_lost += amount
            - stat.happiness -= 1
    - label: "A dozen (pays 2 to 1)"
