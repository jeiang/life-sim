- id: poker-play
  icon: ♣️
  trigger: event
  tags: [gambling]
  chance: 0%
  text: "It is on you. Fold, call, or raise?"
  choices:
    - label: "Fold (get 30% of your buy-in back)"
      outcomes:
        - weight: 1
          text: "You muck your cards and take what is left."
          effects:
            - money += quality.gambling_pot * 3 / 10
            - quality.gambling_streak = 0
            - quality.gambling_lost += quality.gambling_pot * 7 / 10
    - label: "Call"
      outcomes:
        - weight: "(quality.gambling_hand == 1 ? 3000 : quality.gambling_hand == 2 ? 5000 : 6800) + stat.smarts * 5"
          text: "Your hand holds up and you rake in the pot."
          effects:
            - money += quality.gambling_pot * 19 / 10
            - quality.gambling_streak += 1
        - weight: "10000 - ((quality.gambling_hand == 1 ? 3000 : quality.gambling_hand == 2 ? 5000 : 6800) + stat.smarts * 5)"
          text: "Your hand does not hold up."
          effects:
            - quality.gambling_streak = 0
            - quality.gambling_lost += quality.gambling_pot
            - stat.happiness -= 1
    - label: "Raise (adds half your buy-in)"
      when: money >= quality.gambling_pot / 2
      outcomes:
        - weight: "(quality.gambling_hand == 1 ? 3000 : quality.gambling_hand == 2 ? 5000 : 6800) + stat.smarts * 5"
          text: "The table folds or loses to you. A big pot is yours."
          effects:
            - money += quality.gambling_pot * 14 / 5 - quality.gambling_pot / 2
            - quality.gambling_streak += 1
        - weight: "10000 - ((quality.gambling_hand == 1 ? 3000 : quality.gambling_hand == 2 ? 5000 : 6800) + stat.smarts * 5)"
          text: "They call and show a better hand."
          effects:
            - money -= quality.gambling_pot / 2
            - quality.gambling_streak = 0
            - quality.gambling_lost += quality.gambling_pot * 3 / 2
            - stat.happiness -= 1
