- id: blackjack-play
  icon: ♠️
  trigger: event
  tags: [gambling]
  chance: 0%
  text: "The dealer waits. Hit for one more card, or stand?"
  choices:
    - label: "Stand"
      outcomes:
        - weight: "quality.gambling_hand == 12 ? 2816 : quality.gambling_hand == 13 ? 2816 : quality.gambling_hand == 14 ? 2816 : quality.gambling_hand == 15 ? 2816 : quality.gambling_hand == 16 ? 2816 : quality.gambling_hand == 17 ? 2816 : quality.gambling_hand == 18 ? 4267 : quality.gambling_hand == 19 ? 5662 : quality.gambling_hand == 20 ? 6997 : 8799"
          text: "The dealer's hand falls short or busts. You win."
          effects:
            - money += quality.gambling_pot * 2
            - quality.gambling_streak += 1
        - weight: "quality.gambling_hand == 12 ? 0 : quality.gambling_hand == 13 ? 0 : quality.gambling_hand == 14 ? 0 : quality.gambling_hand == 15 ? 0 : quality.gambling_hand == 16 ? 0 : quality.gambling_hand == 17 ? 1451 : quality.gambling_hand == 18 ? 1395 : quality.gambling_hand == 19 ? 1335 : quality.gambling_hand == 20 ? 1803 : 1201"
          text: "A push. Your stake is returned."
          effects:
            - money += quality.gambling_pot
        - weight: "quality.gambling_hand == 12 ? 7184 : quality.gambling_hand == 13 ? 7184 : quality.gambling_hand == 14 ? 7184 : quality.gambling_hand == 15 ? 7184 : quality.gambling_hand == 16 ? 7184 : quality.gambling_hand == 17 ? 5733 : quality.gambling_hand == 18 ? 4338 : quality.gambling_hand == 19 ? 3003 : quality.gambling_hand == 20 ? 1200 : 0"
          text: "The dealer turns over a better hand."
          effects:
            - quality.gambling_streak = 0
            - quality.gambling_lost += quality.gambling_pot
            - stat.happiness -= 1
    - label: "Hit"
      when: quality.gambling_hand < 21
      outcomes:
        - weight: "quality.gambling_hand == 12 ? 3062 : quality.gambling_hand == 13 ? 2845 : quality.gambling_hand == 14 ? 2629 : quality.gambling_hand == 15 ? 2412 : quality.gambling_hand == 16 ? 2195 : quality.gambling_hand == 17 ? 1979 : quality.gambling_hand == 18 ? 1651 : quality.gambling_hand == 19 ? 1215 : quality.gambling_hand == 20 ? 677 : 0"
          text: "A good card, and the dealer cannot match it. You win."
          effects:
            - money += quality.gambling_pot * 2
            - quality.gambling_streak += 1
        - weight: "quality.gambling_hand == 12 ? 553 : quality.gambling_hand == 13 ? 553 : quality.gambling_hand == 14 ? 553 : quality.gambling_hand == 15 ? 553 : quality.gambling_hand == 16 ? 553 : quality.gambling_hand == 17 ? 441 : quality.gambling_hand == 18 ? 334 : quality.gambling_hand == 19 ? 231 : quality.gambling_hand == 20 ? 92 : 0"
          text: "A push. Your stake is returned."
          effects:
            - money += quality.gambling_pot
        - weight: "quality.gambling_hand == 12 ? 6385 : quality.gambling_hand == 13 ? 6602 : quality.gambling_hand == 14 ? 6818 : quality.gambling_hand == 15 ? 7035 : quality.gambling_hand == 16 ? 7252 : quality.gambling_hand == 17 ? 7580 : quality.gambling_hand == 18 ? 8015 : quality.gambling_hand == 19 ? 8554 : quality.gambling_hand == 20 ? 9231 : 10000"
          text: "You bust or the dealer beats you."
          effects:
