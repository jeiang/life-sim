# yaml-language-server: $schema=../../../packages/pack-tools/schema/occupations.schema.json
# Grad careers. Pay is gross cents per year at a 100% wage index plus the raise bonus, scaled by the city wage index.
# partner-lawyer -> judge is a rare offer event, not a promotes_to. Tuned in the artemis balance issue.
- id: resident-doctor
  label: Resident doctor
  icon: 🩺
  group: full-time
  ladder: doctor
  npc: false
  requires: age >= 18 and quality.grad_degree_medical and quality.grad_licensed_medical
  pay: (7000000 + quality.raise_bonus) * city.wage_index / 10000
  promotes_to: attending-doctor
  promotion_years: 3
- id: attending-doctor
  label: Attending doctor
