# yaml-language-server: $schema=../../../packages/pack-tools/schema/occupations.schema.json
# Grad school stages. They are started only by the admit-* storylets, which set grad_program first.
# Tuition is the (negative) pay; the school ends itself at duration_years and the graduate-* events
# (scheduled at admission) finish the paperwork. Core's `graduated` milestone has already fired by then.
- id: grad-medical-school
  label: Medical school
  icon: 🩺
  group: school
  ladder: grad
  npc: false
  requires: quality.grad_program == 1 and not quality.grad_degree_medical and (quality.has_degree_nursing or quality.has_degree_engineering)
  pay: 0 - grad_tuition_cash
  duration_years: 4
- id: grad-law-school
  label: Law school
  icon: ⚖️
  group: school
  ladder: grad
  npc: false
  requires: quality.grad_program == 2 and not quality.grad_degree_law and (quality.has_degree_business or quality.has_degree_arts)
  pay: 0 - grad_tuition_cash
  duration_years: 3
- id: grad-mba-program
  label: MBA program
  icon: 💼
  group: school
  ladder: grad
  npc: false
  requires: quality.grad_program == 3 and not quality.grad_degree_mba and (quality.has_degree_business or quality.has_degree_engineering)
  pay: 0 - grad_tuition_cash
  duration_years: 2
- id: grad-phd-program
  label: PhD program
  icon: 🔬
  group: school
  ladder: grad
  npc: false
  requires: quality.grad_program == 4 and not quality.grad_degree_phd and (quality.has_degree_business or quality.has_degree_engineering or quality.has_degree_nursing or quality.has_degree_arts)
  pay: 600000
  duration_years: 5
