# yaml-language-server: $schema=../../packages/pack-tools/schema/pack.schema.json
id: grad-school
namespace: grad
# Tuition is asked for each year by `grad-tuition-due` (pay from savings, borrow, or reapply for a
# scholarship); the choice sets `grad_funded` and schedules the next ask. The hook is only a fallback:
# a player who was not asked (no choice this year) and cannot cover the year in cash is moved onto the
# graduate loan. It then clears `grad_funded` for the next year. Every loan year adds the tuition due
# to `grad_debt`, which converts into a grad-loan at graduation or drop-out.
hooks:
  on_age_up_pre:
    - quality.grad_loan = quality.grad_loan or (grad_tuition_due > 0 and grad_enrolled and not quality.grad_funded and money < grad_tuition_due)
    - quality.grad_funded = false
    - quality.grad_debt += grad_debt_accrual
