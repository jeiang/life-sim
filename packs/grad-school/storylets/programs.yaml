# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Scaffolded by `pnpm tool scaffold` from the content sheet "Grad programs".

- id: grad-year-review
  icon: 📚
  trigger: event
  chance: 0%
  when: "grad_enrolled"
  text: The year-end transcript lands in your mailbox. Time to see how you really did.
  outcomes:
    - weight: 10 + stat.smarts / 2
      text: Your professors start learning your name. Top marks this year.
      effects:
        - "quality.grad_gpa += 5"
        - "schedule(grad-school/grad-year-review, after: 1-1 years)"
    - weight: 50
      text: A solid year of B minuses. Nobody is writing letters for you yet.
      effects:
        - "quality.grad_gpa += 1"
        - "schedule(grad-school/grad-year-review, after: 1-1 years)"
    - weight: 60 - stat.smarts / 2
      text: Your transcript reads like a cry for help. Your grades slide badly.
      effects:
        - "quality.grad_gpa += 0 - 6"
        - "schedule(grad-school/grad-year-review, after: 1-1 years)"

- id: graduate-medical-school
  icon: 🩺
  trigger: event
  chance: 0%
  when: "quality.grad_program == 1 and not in_group(school)"
  text: The last rotation ends and the hospital hands you a diploma. Your mother cries first.
  outcomes:
    - weight: 1
      text: You finish the rotations and the faculty signs off on your degree.
      effects:
        - "take_loan(grad-school/grad-loan, quality.grad_debt)"
        - "money -= quality.grad_debt"
        - "quality.grad_degree_medical = true"
        - "reach_milestone(grad_medical_graduated)"
        - stat.happiness += 6
        - "quality.grad_program = 0"
        - "quality.grad_tuition = 0"
        - "quality.grad_scholarship = 0"
        - "quality.grad_parents = 0"
        - "quality.grad_loan = false"
        - "quality.grad_debt = 0"
        - "journal(\"Graduated from medical school at age {age}.\")"

- id: graduate-law-school
  icon: ⚖️
  trigger: event
  chance: 0%
  when: "quality.grad_program == 2 and not in_group(school)"
  text: The last exam is done. The bar results are weeks away, but the degree is yours.
  outcomes:
    - weight: 1
      text: You turn in your last brief and the registrar confirms your degree.
      effects:
        - "take_loan(grad-school/grad-loan, quality.grad_debt)"
        - "money -= quality.grad_debt"
