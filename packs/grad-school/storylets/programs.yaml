        - "quality.grad_program = 0"
        - "quality.grad_tuition = 0"
        - "quality.grad_scholarship = 0"
        - "quality.grad_parents = 0"
        - "quality.grad_loan = false"
        - "quality.grad_debt = 0"
        - "journal(\"Graduated from law school at age {age}.\")"

- id: graduate-mba-program
  icon: 💼
  trigger: event
  chance: 0%
  when: "quality.grad_program == 3 and not in_group(school)"
