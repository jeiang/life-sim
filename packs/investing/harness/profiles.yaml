# Simulated player profiles of the Investing Pack; the schema is docs/spec/harness.md#simulated-player-profiles.
# The harness cannot trade on the market screen, so both profiles invest through tips: they take the tipped
# trade (a quarter of their cash, or a sale) and turn down scams and the 5%/10% stakes.
profiles:
  investor:
    description: "Asks a relative or friend, reads the news or buys the book (one source at a time, each at most once a year; looks for work otherwise) and takes the trade a tip offers (a quarter of their cash, a sale, an insider back); declines every scam. No look-ahead at prices"
    moves: 2
    once_per_year: true
    choice:
      prefer: ["put in a quarter*", "sell*", "back it*", "walk away"]
      avoid: ["go all in*", "put in 10%*", "put in 5%*"]
    rules:
      - ids: [investing/ask-for-tip, investing/read-the-news, investing/read-investing-book]
      - ids: ["*/apply-*"]
  tipstacker:
    description: "Asks the smartest relative or friend each year and trades on the tip, the best single source rather than every source. Approximates the majority rule (decision 4, G2): the harness cannot compare two tips. Taking two or three tips a year at a quarter of cash each put it 14% to 44% ahead of `investor` on exposure alone (#366), and 5% stakes put it 18% to 54% behind"
    moves: 4
    once_per_year: true
    choice:
      prefer: ["put in a quarter*", "sell*", "back it*", "walk away"]
      avoid: ["go all in*", "put in 10%*", "put in 5%*"]
    rules:
      - ids: [investing/ask-for-tip]
        pick: max
        by: person.stat.smarts
      - ids: ["*/apply-*"]
