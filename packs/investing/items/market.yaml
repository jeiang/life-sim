  label: Acme Robotics
  icon: 🤖
  category: investments
  requires: age >= 18
  market:
    start: 4500
    drift: 3%
    vol: 22%
    beta: { of: total-market, factor: 110% }
- id: northwind-foods
  label: Northwind Foods
  icon: 🥫
  category: investments
  requires: age >= 18
  market:
    start: 8200
    drift: 2%
    vol: 15%
    beta: { of: total-market, factor: 60% }
- id: lumen-energy
  label: Lumen Energy
  icon: ⚡
  category: investments
  requires: age >= 18
  market:
    start: 1900
    drift: 3%
