# yaml-language-server: $schema=../../../packages/pack-tools/schema/items.schema.json
# Market kinds, traded from the Investments screen (age 18+). Prices are per world year.
# Index funds: the broad market (with rare crashes) and a global fund that follows it.
- id: total-market
  label: Total Market Index Fund
  icon: 📈
  category: investments
  requires: age >= 18
  market:
    start: 10000
    drift: 8%
    vol: 16%
    crash: { chance: 4%, drop: 35% }
- id: world-index
  label: World Index Fund
  icon: 🌍
  category: investments
  requires: age >= 18
  market:
    start: 8500
    drift: 2%
    vol: 8%
    beta: { of: total-market, factor: 75% }
# Bond funds: steadier, lower returns.
- id: income-bond-fund
  label: Income Bond Fund
  icon: 💵
  category: investments
  requires: age >= 18
  market:
    start: 5000
    drift: 3%
    vol: 3%
- id: corporate-bond-fund
  label: Corporate Bond Fund
  icon: 🏦
  category: investments
  requires: age >= 18
  market:
    start: 4000
    drift: 2%
    vol: 6%
    beta: { of: total-market, factor: 10% }
# Fictional stocks: they follow the market, with company risk on top.
