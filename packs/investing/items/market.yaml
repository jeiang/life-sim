# One coin: huge swings, deep crashes.
- id: quark-coin
  label: Quark Coin
  icon: 🪙
  category: investments
  requires: age >= 18
  market:
    start: 250000
    drift: 8%
    vol: 35%
    crash: { chance: 8%, drop: 40% }
# Penny stocks: wild swings, an occasional 10x, and a real chance of being delisted to nothing.
- id: pinecrest-mining
  label: Pinecrest Mining
  icon: ⛏️
  category: investments
  requires: age >= 18
  market:
    start: 250
    drift: -20%
    vol: 60%
    jump: { chance: 1%, multiple: 10 }
    delist: 6%
    relist_after: 8
- id: brightwave-labs
  label: Brightwave Labs
  icon: 🧪
  category: investments
  requires: age >= 18
  market:
    start: 180
    drift: -15%
    vol: 50%
    jump: { chance: 1%, multiple: 10 }
    delist: 5%
    relist_after: 8
# Government bonds: fixed yearly coupon, principal back at maturity, sellable early at market
# price. One issuer for v1, so both carry the same small default chance (rolled per bond); a
# default takes 60% of the remaining principal. A later country sets its own.
- id: gov-bond-5
  label: Government bond (5 years)
  icon: 🏛️
  category: investments
  requires: age >= 18
  market:
    start: 10000
    drift: 0%
    vol: 1%
    bond: { term: 5, coupon: 3%, default: 0.4%, loss: 60% }
- id: gov-bond-10
  label: Government bond (10 years)
  icon: 🏛️
  category: investments
  requires: age >= 18
  market:
    start: 10000
    drift: 0%
    vol: 1%
    bond: { term: 10, coupon: 3%, default: 0.4%, loss: 60% }
