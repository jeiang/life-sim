# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# GENERATED by a hand-run script; edit the YAML directly from here on.
# Scams: decision events that mostly lose money. They draw by weight into the decision slots, and
# the weight falls with smarts and with every scam already lost to (invest_scams). Stakes are a
# share of the player's cash, so a scam never takes more than the player has.

- id: ponzi-scheme
  icon: 🕴️
  trigger: event
  weight: max(1, 2 + (100 - stat.smarts) / 15 - quality.invest_scams)
  tags: [investing, scam]
  when: age >= 18 and money >= 50000
  cooldown: 4
  text: "An acquaintance pitches a members-only fund that pays 20% a month. Everyone in the room is investing."
  choices:
    - label: "Put in 10% of your savings"
      outcomes:
        - weight: 85 + (100 - stat.smarts) / 10
          text: "The fund collapses. The organisers are gone and so is the money."
          effects:
            - money -= money / 10
            - quality.invest_scams += 1
            - stat.happiness -= 6
            - journal("Lost money to a Ponzi scheme at age {age}.")
        - weight: 15 - (100 - stat.smarts) / 10
          text: "The first payouts arrive on time and you pull out early with a profit. Later the scheme collapses around everyone else."
          effects:
            - money += money / 50
            - journal("Got out of a Ponzi scheme in time at age {age}.")
    - label: "Go all in with 40% of your savings"
      outcomes:
        - weight: 85 + (100 - stat.smarts) / 10
          text: "The fund collapses. The organisers are gone and so is the money."
          effects:
            - money -= money * 2 / 5
            - quality.invest_scams += 1
            - stat.happiness -= 10
            - journal("Lost money to a Ponzi scheme at age {age}.")
        - weight: 15 - (100 - stat.smarts) / 10
          text: "The first payouts arrive on time and you pull out early with a profit. Later the scheme collapses around everyone else."
          effects:
            - money += money / 12
            - journal("Got out of a Ponzi scheme in time at age {age}.")
    - label: "Look into it first"
      outcomes:
        - weight: stat.smarts
          text: "You ask for the licence and the audited accounts. There are none, and you walk away."
          effects:
            - stat.smarts += 1
        - weight: 100 - stat.smarts
          text: "You cannot find anything wrong, and the glossy brochure wins you over. You lose a tenth of your savings before you realise."
          effects:
            - money -= money / 10
            - quality.invest_scams += 1
            - stat.happiness -= 6
            - journal("Lost money to a Ponzi scheme at age {age}.")
    - label: "Walk away"
      outcomes:
        - weight: 1
          text: "You decline, and the offer goes to someone else."

