- id: tip-total-market
  icon: 📈
  trigger: event
  tags: [money]
  chance: 0%
  text: A tip says the Total market fund is about to climb. Do you put money in?
  choices:
    - label: Put in 5% of your cash
      when: money >= 20000
      outcomes:
        - weight: 1
          text: You put in a small slice and keep the rest in your pocket.
          effects:
            - trade(investing/total-market, money / 20)
    - label: Put in a quarter of your cash
      when: money >= 20000
      outcomes:
        - weight: 1
          text: You put in a big slice and try not to think about it.
          effects:
            - trade(investing/total-market, money / 4)
    - label: Pass
      outcomes:
        - weight: 1
          text: You leave your cash where it is.

- id: tip-total-market-sell
  icon: 📉
  trigger: event
  tags: [money]
  chance: 0%
  text: A tip says the Total market fund is about to slide. Do you sell?
  choices:
    - label: Sell a quarter of your holding
      when: units(investing/total-market) > 0
      outcomes:
        - weight: 1
          text: You sell a quarter of your holding and feel smart about it.
          effects:
            - "trade(investing/total-market, 0 - holding_value(investing/total-market) / 4)"
    - label: Pass
      outcomes:
        - weight: 1
          text: You hold on to what you have.

