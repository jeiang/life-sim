# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# GENERATED by a hand-run script; edit the YAML directly from here on.
# Tip sources. Each source gives at most one tip a year (cooldown 1; relatives and friends are
# per person). The kind is drawn by the source, not the player: every kind's outcome weight is
# a base weight (zero for a kind priced under 20 minor units, which is as good as dead) tilted by the stored forecast of that kind and the source's quality (a
# relative's smarts, the news, a book), so a good source is right more often but never always.
# An insider tip (relatives and friends only, rare) almost only names a kind forecast to soar.
# Each tip chains to a per-kind event that offers the trade.

- id: ask-for-tip
  label: "Ask for an investing tip"
  icon: 💡
  trigger: action
  menu: relationships
  scope: person
  target: [core-loop/parent, core-loop/sibling, core-loop/friend, core-loop/partner, core-loop/spouse]
  tags: [investing, tip]
  when: age >= 18 and person.age >= 18
  cooldown: 1
  text: "You ask {person.first_name} what {person.subject} would buy."
  outcomes:
    - weight: "price(investing/total-market) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/total-market) / 100)"
      text: "{person.first_name} leans in: \"I like Total Market Index Fund. Worth a look.\""
      effects: []
      next: tip-total-market
    - weight: "price(investing/world-index) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/world-index) / 100)"
      text: "{person.first_name} leans in: \"I like World Index Fund. Worth a look.\""
      effects: []
      next: tip-world-index
    - weight: "price(investing/income-bond-fund) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/income-bond-fund) / 100)"
      text: "{person.first_name} leans in: \"I like Income Bond Fund. Worth a look.\""
      effects: []
      next: tip-income-bond-fund
    - weight: "price(investing/corporate-bond-fund) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/corporate-bond-fund) / 100)"
      text: "{person.first_name} leans in: \"I like Corporate Bond Fund. Worth a look.\""
      effects: []
      next: tip-corporate-bond-fund
    - weight: "price(investing/acme-robotics) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/acme-robotics) / 100)"
      text: "{person.first_name} leans in: \"I like Acme Robotics. Worth a look.\""
