- id: tip-total-market
  icon: 💡
  trigger: event
  chance: 0%
  tags: [investing, tip]
  text: "Do you act on the tip about Total Market Index Fund?"
  choices:
    - label: "Put in 5% of your cash"
      when: money >= 20000
      outcomes:
        - weight: 1
          text: "You put a small slice of your cash into Total Market Index Fund."
          effects:
            - trade(investing/total-market, money / 20)
    - label: "Put in 25% of your cash"
      when: money >= 20000
      outcomes:
        - weight: 1
          text: "You back Total Market Index Fund with a quarter of your cash."
          effects:
            - trade(investing/total-market, money / 4)
    - label: "Pass"
      outcomes:
        - weight: 1
          text: "You keep your cash where it is."

