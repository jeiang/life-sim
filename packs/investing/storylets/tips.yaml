- id: insider-total-market
  icon: 🤫
  trigger: event
  chance: 0%
  tags: [investing, tip, insider]
  text: "Acting on an inside tip about Total Market Index Fund is not quite legal."
  choices:
    - label: "Back it with 40% of your cash"
      when: money >= 20000
      outcomes:
        - weight: 1
          text: "You quietly move a big share of your cash into Total Market Index Fund."
          effects:
            - trade(investing/total-market, money * 2 / 5)
            - quality.invest_insider_age = age
            - journal("Traded on an inside tip at age {age}.")
    - label: "Pass"
      outcomes:
        - weight: 1
          text: "You do not want to know. You change the subject."

