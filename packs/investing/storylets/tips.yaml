    - weight: "price(investing/lumen-energy) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/lumen-energy) / 100)"
      text: "{person.first_name} leans in: \"I like Lumen Energy. Worth a look.\""
      effects: []
      next: tip-lumen-energy
    - weight: "price(investing/quark-coin) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/quark-coin) / 100)"
      text: "{person.first_name} leans in: \"I like Quark Coin. Worth a look.\""
      effects: []
      next: tip-quark-coin
    - weight: "price(investing/pinecrest-mining) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/pinecrest-mining) / 100)"
      text: "{person.first_name} leans in: \"I like Pinecrest Mining. Worth a look.\""
      effects: []
      next: tip-pinecrest-mining
    - weight: "price(investing/brightwave-labs) < 20 ? 0 : max(100, 1000 + (5 + person.stat.smarts / 20) * forecast(investing/brightwave-labs) / 100)"
      text: "{person.first_name} leans in: \"I like Brightwave Labs. Worth a look.\""
      effects: []
      next: tip-brightwave-labs
    - weight: "price(investing/total-market) < 20 ? 0 : min(20, max(0, forecast(investing/total-market) - 2000) / 100)"
      when: person.age >= 25
      text: "{person.first_name} lowers {person.possessive} voice: \"Between us, Total Market Index Fund is about to jump. I know someone on the inside.\""
