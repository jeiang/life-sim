- id: child-move-abroad
  icon: ✈️
  trigger: event
  chance: 0.25%
  when: age >= 5 and age < 18 and living.with_parents
  max_per_life: 1
  tags: [relocation, school]
  text: "Your family moves to another country."
  outcomes:
    - weight: 1
      when: 'city.country != "us"'
      text: "The family moves to Dustwater. A new school, a new language, and everything else new."
      effects:
        - move_to(core-loop/dustwater)
        - quality.reloc_home_country = 1
        - quality.lang_english = max(quality.lang_english, 40)
        - quality.reloc_child_move_age = age
