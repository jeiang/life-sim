# Friends from the old school fade: the NPC pass runs in the year of the move.
- id: childhood-friends-lose-touch
  icon: 💔
  trigger: event
  scope: person
  target: [core-loop/friend, core-loop/classmate]
  chance: 70%
  when: quality.reloc_child_move_age > 0 and quality.reloc_child_move_age == age
  tags: [relocation]
  outcomes:
    - weight: 1
      effects:
        - relationship(person).closeness += -12

