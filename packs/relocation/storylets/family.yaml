# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Relatives and friends left behind. Nobody has a location in v1: `quality.reloc_abroad` says the
# player lives outside their home country, and the NPC pass (after the player's year) applies these
# to every living parent, sibling and friend. Closeness drifts down each year unless you keep up:
# a call is +4 and a visit home is +10 on the reunion a year later, against a drift of -6 at 75%.
- id: left-behind-drift
  trigger: event
  scope: person
  target: [core-loop/parent, core-loop/sibling, core-loop/friend]
  chance: 75%
  when: quality.reloc_abroad
  tags: [relocation]
  outcomes:
    - weight: 1
      effects:
        - relationship(person).closeness += -6

- id: call-home
  label: Call home
  icon: 📞
  trigger: action
  menu: relationships
  scope: person
  target: [core-loop/parent, core-loop/sibling, core-loop/friend]
  tags: [relocation, relationship]
  when: quality.reloc_abroad
  repeatable: true
  text: "You dial {person.first_name}, across the time zones."
  outcomes:
    - weight: 80
      text: "A long, warm call. It is good to hear a familiar voice."
      effects:
        - stat.happiness += 2
        - relationship(person).closeness += 4
    - weight: 20
      text: "A bad line and a short call, but you both tried."
      effects:
        - relationship(person).closeness += 1

- id: visit-home
  label: Visit home
  icon: 🛬
  trigger: action
  menu: assets/relocation
  tags: [relocation]
  when: age >= 18 and not confined and quality.reloc_abroad and money >= 120000
  cooldown: 1
  text: "A trip home costs $1,200. The people you left behind will want to see you."
  outcomes:
    - weight: 1
      text: "You spend a week at home, back in the old kitchens and streets."
      effects:
        - money -= 120000
        - stat.happiness += 4
        - quality.reloc_return_age = age
        - journal("Visited home at age {age}.")

- id: reunion
  icon: 🫂
  trigger: event
  scope: person
  target: [core-loop/parent, core-loop/sibling, core-loop/friend]
  chance: 80%
  when: quality.reloc_return_age > 0 and quality.reloc_return_age == age - 1
  tags: [relocation]
  text: "{person.first_name} has not forgotten your time back home."
  outcomes:
    - weight: 75
      text: "You and {person.first_name} pick up like no time has passed."
      effects:
        - stat.happiness += 2
        - relationship(person).closeness += 10
    - weight: 25
      text: "{person.first_name} is warm, but the distance shows."
      effects:
        - relationship(person).closeness += 4

