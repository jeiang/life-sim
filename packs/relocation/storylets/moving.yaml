# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Emigrating and coming home. Emigrating is a chain: pick a city (the $3,000 application fee is
# paid at once and not refunded) -> approval roll -> what happens to your job -> arrival. Moving
# back home skips the approval roll. Domestic moves in the United States are core-loop's
# `move-city`; `move-city-abroad` is the same move for the other four countries.
# `quality.reloc_dest` carries the picked city (1-6 the US cities in core-loop's order, 7-14 the
# cities of this Pack) through the chain.

- id: emigrate
  label: Emigrate
  icon: ✈️
  trigger: action
  menu: assets/relocation
  tags: [relocation]
  when: age >= 18 and not living.with_parents and not confined and not in_group("school") and quality.reloc_home_country > 0 and money >= 300000
  cooldown: 1
  text: "Emigrating costs a $3,000 application fee, which is not refunded. Approval depends on your smarts, savings, degree, work history and the language. A denied application can be tried again next year."
  choices:
    - label: Dustwater (United States)
      when: city.country != "us" and quality.reloc_home_country != 1
      outcomes:
        - weight: 1
          text: "You file an application for Dustwater."
          effects:
            - money -= 300000
            - quality.reloc_dest = 1
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Harborview (United States)
      when: city.country != "us" and quality.reloc_home_country != 1
      outcomes:
        - weight: 1
          text: "You file an application for Harborview."
          effects:
            - money -= 300000
            - quality.reloc_dest = 2
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Maple Falls (United States)
      when: city.country != "us" and quality.reloc_home_country != 1
      outcomes:
        - weight: 1
          text: "You file an application for Maple Falls."
          effects:
            - money -= 300000
            - quality.reloc_dest = 3
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Riverton (United States)
      when: city.country != "us" and quality.reloc_home_country != 1
      outcomes:
        - weight: 1
          text: "You file an application for Riverton."
          effects:
            - money -= 300000
            - quality.reloc_dest = 4
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Lakeshore (United States)
      when: city.country != "us" and quality.reloc_home_country != 1
      outcomes:
        - weight: 1
          text: "You file an application for Lakeshore."
          effects:
            - money -= 300000
            - quality.reloc_dest = 5
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Goldcrest (United States)
      when: city.country != "us" and quality.reloc_home_country != 1
      outcomes:
        - weight: 1
          text: "You file an application for Goldcrest."
          effects:
            - money -= 300000
            - quality.reloc_dest = 6
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Toronto
      when: city.country != "ca" and quality.reloc_home_country != 2
      outcomes:
        - weight: 1
          text: "You file an application for Toronto."
          effects:
            - money -= 300000
            - quality.reloc_dest = 7
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Montreal
      when: city.country != "ca" and quality.reloc_home_country != 2
      outcomes:
        - weight: 1
          text: "You file an application for Montreal."
          effects:
            - money -= 300000
            - quality.reloc_dest = 8
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: London
      when: city.country != "uk" and quality.reloc_home_country != 3
      outcomes:
        - weight: 1
          text: "You file an application for London."
          effects:
            - money -= 300000
            - quality.reloc_dest = 9
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Manchester
      when: city.country != "uk" and quality.reloc_home_country != 3
      outcomes:
        - weight: 1
          text: "You file an application for Manchester."
          effects:
            - money -= 300000
            - quality.reloc_dest = 10
            - quality.reloc_applications += 1
          next: emigrate-decision
    - label: Tokyo
      when: city.country != "jp" and quality.reloc_home_country != 4
