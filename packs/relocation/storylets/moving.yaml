- id: emigrate-decision
  icon: 🛂
  trigger: event
  chance: 0%
  tags: [relocation]
  text: "The application goes in. Now you wait."
  outcomes:
    - weight: clamp(10 + stat.smarts / 4 + min(15, money / 500000) + ((quality.has_degree_business or quality.has_degree_engineering or quality.has_degree_nursing or quality.has_degree_arts) ? 15 : 0) + min(15, 2 * (years_in_group("full-time") + years_in_group("part-time"))) + (quality.reloc_dest == 8 ? quality.lang_french : (quality.reloc_dest >= 11 and quality.reloc_dest <= 12 ? quality.lang_japanese : (quality.reloc_dest >= 13 ? quality.lang_spanish : quality.lang_english))) / 10 - (quality.criminal_record ? 30 : 0), 5, 95)
      text: "Approved. The visa arrives in the post."
      effects:
        - quality.reloc_abroad = true
        - stat.happiness -= 3
      next: emigrate-job
    - weight: 100 - clamp(10 + stat.smarts / 4 + min(15, money / 500000) + ((quality.has_degree_business or quality.has_degree_engineering or quality.has_degree_nursing or quality.has_degree_arts) ? 15 : 0) + min(15, 2 * (years_in_group("full-time") + years_in_group("part-time"))) + (quality.reloc_dest == 8 ? quality.lang_french : (quality.reloc_dest >= 11 and quality.reloc_dest <= 12 ? quality.lang_japanese : (quality.reloc_dest >= 13 ? quality.lang_spanish : quality.lang_english))) / 10 - (quality.criminal_record ? 30 : 0), 5, 95)
      text: "Denied. You may apply again next year."
      effects:
        - quality.reloc_denials += 1
        - quality.reloc_dest = 0
        - stat.happiness -= 4
        - journal("Was denied permission to emigrate at age {age}.")

# Moving ends your job unless it can be done remotely (an occupation with `remote: true`) and
# your boss agrees. Retirement pay always continues. Only core-loop's jobs are named here;
# a job another Pack ships needs its own bridge.
- id: emigrate-job
  icon: 💼
  trigger: event
  chance: 0%
  tags: [relocation]
  outcomes:
    - weight: 1
      when: not in_group("full-time") and not in_group("part-time")
      next: relocation-arrive
    - weight: 50 + stat.smarts / 4
      when: has_remote_job()
      text: "Your boss agrees to let you keep working from afar."
      effects:
        - journal("Kept a remote job through a move at age {age}.")
      next: relocation-arrive
    - weight: 100 - (50 + stat.smarts / 4)
      when: has_remote_job()
      text: "Your boss will not allow remote work, and the job ends with the move."
      effects:
        - end_occupation(core-loop/cashier)
        - end_occupation(core-loop/barista)
        - end_occupation(core-loop/server)
        - end_occupation(core-loop/shift-lead)
        - end_occupation(core-loop/restaurant-manager)
        - end_occupation(core-loop/apprentice)
        - end_occupation(core-loop/electrician)
        - end_occupation(core-loop/master-electrician)
        - end_occupation(core-loop/junior-analyst)
        - end_occupation(core-loop/analyst)
        - end_occupation(core-loop/senior-analyst)
        - end_occupation(core-loop/junior-engineer)
        - end_occupation(core-loop/engineer)
        - end_occupation(core-loop/senior-engineer)
        - end_occupation(core-loop/staff-nurse)
        - end_occupation(core-loop/charge-nurse)
        - end_occupation(core-loop/nurse-manager)
        - end_occupation(core-loop/studio-assistant)
        - end_occupation(core-loop/designer)
        - end_occupation(core-loop/art-director)
        - journal("Lost a job to a move at age {age}.")
      next: relocation-arrive
    - weight: 1
      when: (in_group("full-time") or in_group("part-time")) and not has_remote_job()
      text: "The job cannot follow you, and it ends with the move."
      effects:
        - end_occupation(core-loop/cashier)
        - end_occupation(core-loop/barista)
        - end_occupation(core-loop/server)
        - end_occupation(core-loop/shift-lead)
        - end_occupation(core-loop/restaurant-manager)
        - end_occupation(core-loop/apprentice)
        - end_occupation(core-loop/electrician)
        - end_occupation(core-loop/master-electrician)
        - end_occupation(core-loop/junior-analyst)
        - end_occupation(core-loop/analyst)
        - end_occupation(core-loop/senior-analyst)
        - end_occupation(core-loop/junior-engineer)
        - end_occupation(core-loop/engineer)
        - end_occupation(core-loop/senior-engineer)
        - end_occupation(core-loop/staff-nurse)
        - end_occupation(core-loop/charge-nurse)
        - end_occupation(core-loop/nurse-manager)
        - end_occupation(core-loop/studio-assistant)
        - end_occupation(core-loop/designer)
        - end_occupation(core-loop/art-director)
        - journal("Lost a job to a move at age {age}.")
      next: relocation-arrive

- id: relocation-arrive
  icon: 🏠
  trigger: event
  chance: 0%
  tags: [relocation]
  # Arriving gives a low starting skill (12) in the city's language; your own skill is never lowered.
  outcomes:
    - weight: 1
      when: quality.reloc_dest == 1
      text: "You settle into Dustwater."
      effects:
        - move_to(core-loop/dustwater)
        - quality.reloc_dest = 0
        - journal("Moved to Dustwater at age {age}.")
    - weight: 1
      when: quality.reloc_dest == 2
      text: "You settle into Harborview."
      effects:
        - move_to(core-loop/harborview)
        - quality.reloc_dest = 0
        - journal("Moved to Harborview at age {age}.")
    - weight: 1
      when: quality.reloc_dest == 3
      text: "You settle into Maple Falls."
      effects:
        - move_to(core-loop/maple-falls)
        - quality.reloc_dest = 0
        - journal("Moved to Maple Falls at age {age}.")
    - weight: 1
      when: quality.reloc_dest == 4
      text: "You settle into Riverton."
      effects:
        - move_to(core-loop/riverton)
        - quality.reloc_dest = 0
        - journal("Moved to Riverton at age {age}.")
    - weight: 1
      when: quality.reloc_dest == 5
      text: "You settle into Lakeshore."
      effects:
        - move_to(core-loop/lakeshore)
        - quality.reloc_dest = 0
        - journal("Moved to Lakeshore at age {age}.")
    - weight: 1
