# yaml-language-server: $schema=../../../packages/pack-tools/schema/storylets.schema.json
# Trip actions: the action's choices are five named price tiers (price in the label); the pick sets
# quality.vac_tier (1-5) and chains to the destination/voyage step, whose gains scale with the repeat
# curve (the chain keeps the action's factor). Tier `quality.vac_tier` shifts weight from bad events to
# great ones. Weights of every trip sum to 10000, with the single death outcome at weight 1.
- id: take-vacation
  label: Take a vacation
  icon: 🧳
  trigger: action
  menu: activities/travel
  tags: [activity, travel]
  when: age >= 16 and money >= 50000
  repeatable: true
  text: "Time to get away. How much do you want to spend?"
  choices:
    - label: "Backpacking ($500)"
      when: money >= 50000
      outcomes:
        - weight: 1
          text: "You pack light and look for deals."
          effects:
            - quality.vac_tier = 1
          next: vacation-destination
    - label: "Budget ($1,000)"
      when: money >= 100000
      outcomes:
        - weight: 1
          text: "You book somewhere sensible."
          effects:
            - quality.vac_tier = 2
          next: vacation-destination
    - label: "Standard ($1,500)"
      when: money >= 150000
      outcomes:
        - weight: 1
          text: "You book a comfortable trip."
          effects:
            - quality.vac_tier = 3
          next: vacation-destination
    - label: "Luxury ($2,000)"
      when: money >= 200000
      outcomes:
        - weight: 1
          text: "You book somewhere special."
          effects:
            - quality.vac_tier = 4
          next: vacation-destination
    - label: "Private jet ($2,500)"
      when: money >= 250000
      outcomes:
        - weight: 1
          text: "You charter a plane and do not look at the bill."
          effects:
            - quality.vac_tier = 5
          next: vacation-destination

- id: vacation-destination
  trigger: event
  chance: 0%
  text: "Where to?"
  choices:
    - label: "Beach"
      outcomes:
        - weight: 1500 + 500 * quality.vac_tier
          text: "Sun, sand and a week you will talk about for years."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 6 + 2 * quality.vac_tier
            - stat.health += 2
            - journal("Took a great trip to the beach at age {age}.")
        - weight: 4000
          text: "A relaxing week by the sea."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 3 + quality.vac_tier
        - weight: 1499
          text: "The beach is crowded and the hotel is average, but it is still a break."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 1
        - weight: 200 * (6 - quality.vac_tier)
          text: "You fall asleep in the sun and burn badly."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.health -= 4
            - stat.happiness -= 2
        - weight: 150 * (6 - quality.vac_tier)
          text: "It rains all week and the beach stays empty."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness -= 5
        - weight: 150 * (6 - quality.vac_tier)
          text: "A bag goes missing from the sand, along with some cash."
          effects:
            - money -= quality.vac_tier * 50000
            - money -= min(money, quality.vac_tier * 50000 / 4)
            - stat.happiness -= 2
            - journal("Had a bag stolen at the beach at age {age}.")
        - weight: 1
          text: "A rip current drags you out too far, and the lifeguards reach you too late."
          effects:
            - money -= quality.vac_tier * 50000
            - journal("Drowned on a beach holiday at age {age}.")
            - die("travel accident")
    - label: "City break"
      outcomes:
        - weight: 1500 + 500 * quality.vac_tier
          text: "Museums, markets and late dinners: a city break packed with memories."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 6 + 2 * quality.vac_tier
            - stat.smarts += 2
            - journal("Took a great trip to the city at age {age}.")
        - weight: 4000
          text: "A pleasant few days of sightseeing and good food."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 3 + quality.vac_tier
        - weight: 1499
          text: "Long queues and tired feet, but the city has its moments."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 1
        - weight: 250 * (6 - quality.vac_tier)
          text: "A pickpocket lifts your wallet on a crowded street."
          effects:
            - money -= quality.vac_tier * 50000
            - money -= min(money, quality.vac_tier * 50000 / 2)
            - stat.happiness -= 3
            - journal("Was pickpocketed on a city break at age {age}.")
        - weight: 150 * (6 - quality.vac_tier)
          text: "The hotel is noisy and the whole break is overpriced."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness -= 4
        - weight: 100 * (6 - quality.vac_tier)
          text: "You walk yourself into the ground and catch a cold."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.health -= 3
        - weight: 1
          text: "Crossing a busy junction in an unfamiliar city, you are hit by a car."
          effects:
            - money -= quality.vac_tier * 50000
            - journal("Died in a road accident on a city break at age {age}.")
            - die("travel accident")
    - label: "Mountains"
      outcomes:
        - weight: 1500 + 500 * quality.vac_tier
          text: "Clear air and wide views on a mountain trip."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 6 + 2 * quality.vac_tier
            - stat.health += 2
            - stat.looks += 1
            - journal("Took a great trip to the mountains at age {age}.")
        - weight: 4000
          text: "A good week of hiking and early nights."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 3 + quality.vac_tier
        - weight: 1499
          text: "The trails are muddy and the cabin is cold, but the air does you good."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 1
        - weight: 250 * (6 - quality.vac_tier)
          text: "You twist an ankle on a loose trail."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.health -= 6
            - stat.happiness -= 2
            - journal("Hurt an ankle on a mountain trip at age {age}.")
        - weight: 150 * (6 - quality.vac_tier)
          text: "Cloud closes in and the views never appear."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness -= 5
        - weight: 100 * (6 - quality.vac_tier)
          text: "A hired gear set breaks and you pay for the repairs."
          effects:
            - money -= quality.vac_tier * 50000
            - money -= min(money, quality.vac_tier * 50000 / 3)
            - stat.happiness -= 1
        - weight: 1
          text: "A path gives way on a steep slope."
          effects:
            - money -= quality.vac_tier * 50000
            - journal("Died in a fall on a mountain trip at age {age}.")
            - die("travel accident")
    - label: "Theme park"
      outcomes:
        - weight: 1500 + 500 * quality.vac_tier
          text: "Rides, fireworks and a trip you wish would never end."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 6 + 2 * quality.vac_tier
            - journal("Took a great trip to the theme park at age {age}.")
        - weight: 4000
          text: "A fun few days of rides and sugary snacks."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 3 + quality.vac_tier
        - weight: 1499
          text: "The lines are long, but the roller coasters still make you scream."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 1
        - weight: 100 * (6 - quality.vac_tier)
          text: "A spinning ride and a big lunch do not mix."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.health -= 3
            - stat.happiness -= 1
        - weight: 200 * (6 - quality.vac_tier)
          text: "You spend most of the trip standing in queues."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness -= 4
        - weight: 200 * (6 - quality.vac_tier)
          text: "Food, souvenirs and photo passes empty your wallet."
          effects:
            - money -= quality.vac_tier * 50000
            - money -= min(money, quality.vac_tier * 50000 / 3)
            - stat.happiness -= 1
        - weight: 1
          text: "A ride malfunctions."
          effects:
            - money -= quality.vac_tier * 50000
            - journal("Died in an accident at a theme park at age {age}.")
            - die("travel accident")
    - label: "Abroad"
      when: age >= 18
      outcomes:
        - weight: 1500 + 500 * quality.vac_tier
          text: "New language, new food and a trip abroad that changes how you see things."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 6 + 2 * quality.vac_tier
            - stat.smarts += 2
            - journal("Took a great trip to overseas at age {age}.")
        - weight: 4000
          text: "A rewarding trip to somewhere you have never been."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 3 + quality.vac_tier
        - weight: 1499
          text: "Jet lag and confusing signs, but you tick another country off the list."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness += 1
        - weight: 150 * (6 - quality.vac_tier)
          text: "Something you ate does not agree with you."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.health -= 5
            - journal("Got ill while travelling abroad at age {age}.")
        - weight: 150 * (6 - quality.vac_tier)
          text: "Flights are cancelled and the luggage is lost."
          effects:
            - money -= quality.vac_tier * 50000
            - stat.happiness -= 5
        - weight: 200 * (6 - quality.vac_tier)
          text: "A scam at a tourist spot costs you far more than it should."
          effects:
            - money -= quality.vac_tier * 50000
            - money -= min(money, quality.vac_tier * 50000 / 2)
            - stat.happiness -= 3
            - journal("Was scammed while travelling abroad at age {age}.")
        - weight: 1
          text: "A road accident far from home."
          effects:
            - money -= quality.vac_tier * 50000
            - journal("Died in an accident while travelling abroad at age {age}.")
            - die("travel accident")

- id: go-on-cruise
  label: Go on a cruise
  icon: 🚢
  trigger: action
  menu: activities/travel
  tags: [activity, travel]
  when: age >= 18 and money >= 120000
  repeatable: true
  text: "You pack for the open sea. Which berth?"
  choices:
    - label: "Shared cabin ($1,200)"
      when: money >= 120000
      outcomes:
        - weight: 1
          text: "You take the cheapest berth on board."
          effects:
            - quality.vac_tier = 1
          next: cruise-voyage
    - label: "Inside cabin ($2,400)"
      when: money >= 240000
      outcomes:
        - weight: 1
          text: "You book a small inside cabin."
          effects:
            - quality.vac_tier = 2
          next: cruise-voyage
    - label: "Ocean view ($3,600)"
      when: money >= 360000
      outcomes:
        - weight: 1
          text: "You book a cabin with a view."
          effects:
            - quality.vac_tier = 3
          next: cruise-voyage
    - label: "Balcony suite ($4,800)"
      when: money >= 480000
      outcomes:
        - weight: 1
          text: "You book a suite with a balcony."
          effects:
            - quality.vac_tier = 4
          next: cruise-voyage
    - label: "Royal suite ($6,000)"
      when: money >= 600000
      outcomes:
        - weight: 1
          text: "You book the best suite on the ship."
          effects:
            - quality.vac_tier = 5
          next: cruise-voyage

- id: cruise-voyage
  trigger: event
  chance: 0%
  text: "The ship pulls out of port."
  outcomes:
    - weight: 1500 + 500 * quality.vac_tier
      text: "A cruise: warm decks, new ports and nothing to do but enjoy it."
      effects:
        - money -= quality.vac_tier * 120000
        - stat.happiness += 8 + 3 * quality.vac_tier
        - stat.health += 2
        - journal("Enjoyed a cruise at age {age}.")
    - weight: 4000
      text: "A smooth crossing with good food and good company."
      effects:
        - money -= quality.vac_tier * 120000
        - stat.happiness += 4 + quality.vac_tier
    - weight: 1499
      text: "The cabin is small and the entertainment is dull, but the sea air helps."
      effects:
        - money -= quality.vac_tier * 120000
        - stat.happiness += 1
    - weight: 150 * (6 - quality.vac_tier)
      text: "Rough seas leave you queasy for days."
      effects:
        - money -= quality.vac_tier * 120000
        - stat.health -= 4
        - stat.happiness -= 2
    - weight: 100 * (6 - quality.vac_tier)
      text: "A stomach bug sweeps the ship and you catch it."
      effects:
        - money -= quality.vac_tier * 120000
        - stat.health -= 6
        - journal("Caught a stomach bug on a cruise at age {age}.")
    - weight: 150 * (6 - quality.vac_tier)
      text: "Onboard extras and a shore excursion cost far more than planned."
      effects:
        - money -= quality.vac_tier * 120000
        - money -= min(money, quality.vac_tier * 120000 / 3)
        - stat.happiness -= 2
    - weight: 100 * (6 - quality.vac_tier)
      text: "Bad weather cancels the ports and the cruise goes nowhere."
      effects:
        - money -= quality.vac_tier * 120000
        - stat.happiness -= 5
    - weight: 1
      text: "You go overboard in the night and are not found in time."
      effects:
        - money -= quality.vac_tier * 120000
        - journal("Was lost at sea on a cruise at age {age}.")
        - die("travel accident")

- id: family-trip
  icon: 🚗
  trigger: event
  weight: 6
  when: age >= 6 and age <= 17 and living.with_parents and count_role(core-loop/parent, 0, 100) >= 1
  cooldown: 2
  text: "The family is planning a trip away this year."
  choices:
    - label: Go along
      outcomes:
        - weight: 3500
          text: "A great trip: games in the car, ice cream and plenty of laughs."
          effects:
            - quality.vac_family_trip_age = age
            - stat.happiness += 8
            - journal("Went on a family trip at age {age}.")
        - weight: 4500
          text: "A nice few days away together."
          effects:
            - quality.vac_family_trip_age = age
            - stat.happiness += 4
        - weight: 800
          text: "Car sickness and a stomach bug ruin half the trip."
          effects:
            - quality.vac_family_trip_age = age
            - stat.health -= 3
            - stat.happiness -= 1
        - weight: 700
          text: "Everyone is tired and cranky, and the trip ends in arguments."
          effects:
            - quality.vac_family_trip_age = age
            - stat.happiness -= 4
        - weight: 499
          text: "A bag with your pocket money goes missing on the way."
          effects:
            - quality.vac_family_trip_age = age
            - money -= min(money, 3000)
            - stat.happiness -= 1
        - weight: 1
          text: "An accident on the road ends the trip."
          effects:
            - journal("Died in a road accident on a family trip at age {age}.")
            - die("travel accident")
    - label: Stay home
      outcomes:
        - weight: 1
          text: "You stay home while everyone else goes. The house is quiet."
          effects:
            - stat.happiness -= 1

- id: family-trip-bond
  icon: 👨‍👩‍👧
  trigger: event
  scope: person
  target: [core-loop/parent]
  chance: 100%
  when: quality.vac_family_trip_age == age and age >= 6 and age <= 17
  text: "The trip with {person.first_name} {person.last_name} brings you closer."
  outcomes:
    - weight: 1
      effects:
        - relationship(person).closeness += 8
        - journal("Grew closer to {person.first_name} {person.last_name} on a family trip at age {age}.")
