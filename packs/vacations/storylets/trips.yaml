# GENERATED by hand-run script; edit the YAML directly from here on.
# Trip actions: the picker's amount is the price tier (1-5 steps of the tier price); tier
# `amount / step` shifts weight from bad events to great ones. Weights of every trip sum to
# 10000, with the single death outcome at weight 1 (1 in 10,000 trips).
- id: take-vacation
  label: Take a vacation
  icon: 🧳
  trigger: action
  menu: activities/travel
  tags: [activity, travel]
  when: age >= 16
  repeatable: true
  amount: { min: 50000, max: "min(250000, money)", step: 50000 }
  text: "Time to get away. Where to?"
  choices:
    - label: "Beach"
      outcomes:
        - weight: 1500 + 500 * (amount / 50000)
          text: "Sun, sand and a {amount} week you will talk about for years."
          effects:
            - money -= amount
            - stat.happiness += 6 + 2 * (amount / 50000)
            - stat.health += 2
            - journal("Took a great trip to the beach at age {age}.")
        - weight: 4000
          text: "A relaxing {amount} week by the sea."
          effects:
            - money -= amount
            - stat.happiness += 3 + (amount / 50000)
        - weight: 1499
          text: "The beach is crowded and the hotel is average, but it is still a break."
          effects:
            - money -= amount
            - stat.happiness += 1
        - weight: 200 * (6 - amount / 50000)
          text: "You fall asleep in the sun and burn badly."
          effects:
