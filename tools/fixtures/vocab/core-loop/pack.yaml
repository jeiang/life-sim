id: core-loop
currency:
  symbol: "$"
  digits: 2
stats:
  - { id: happiness, label: Happiness, start: [50, 100] }
  - { id: smarts, label: Smarts, start: [0, 100] }
exclusivity: [school, full-time]
year:
  slots: [1, 3]
  cap: 4
hooks:
  on_birth:
    - quality.luck = 1
  on_milestone:
    graduated:
      - stat.smarts += 2
settlement:
  - { id: rent, kind: cost, label: Rent, amount: 1200 }
